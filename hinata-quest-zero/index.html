<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07172c">
  <title>日向坂クエスト0｜ハッピーオーラを求めて</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <section id="stage" aria-label="日向坂クエスト0 ゲーム画面">
    <canvas id="game" width="640" height="360"></canvas>

    <div id="hud" class="hud hidden">
      <div><small>HINATIA</small><strong id="location">はじまりの草原</strong></div>
      <div class="goal"><small>NEXT</small><strong id="objective">王都を目指そう</strong></div>
    </div>

    <section id="title" class="title-screen">
      <p class="eyebrow">HINATIA CHRONICLE</p>
      <h1>日向坂クエスト<span>0</span><small>ハッピーオーラを求めて</small></h1>
      <div class="title-menu">
        <button data-title="new" class="selected">はじめから</button>
        <button data-title="load">つづきから</button>
      </div>
      <p class="notice">本作品は非公式のファンメイド作品です。<br>実在の人物・団体・作品とは公式な関係はありません。</p>
    </section>

    <section id="name-modal" class="overlay hidden">
      <div class="window name-window">
        <p class="eyebrow">PLAYER NAME</p>
        <h2>あなたの名前を教えてください</h2>
        <input id="name-input" maxlength="8" value="トシ" autocomplete="off">
        <div class="row"><button id="name-back">もどる</button><button id="name-ok" class="primary">冒険をはじめる</button></div>
      </div>
    </section>

    <section id="dialogue" class="dialogue hidden">
      <canvas id="portrait" width="84" height="84"></canvas>
      <div><strong id="speaker">？？？</strong><p id="text"></p><i>▼</i></div>
    </section>

    <section id="battle" class="battle-ui hidden">
      <div id="battle-log" class="battle-log"></div>
      <div id="party" class="party"></div>
      <div id="commands" class="commands"></div>
    </section>

    <section id="menu" class="overlay hidden">
      <div class="window menu-window">
        <header><div><p class="eyebrow">ADVENTURE MENU</p><h2>旅の記録</h2></div><button id="menu-close" class="close">×</button></header>
        <div id="menu-body"></div>
        <nav><button data-tab="status">能力</button><button data-tab="items">道具</button><button data-tab="equip">装備</button><button data-tab="save">記録</button></nav>
      </div>
    </section>

    <section id="load-modal" class="overlay hidden">
      <div class="window load-window"><p class="eyebrow">CONTINUE</p><h2>冒険の書</h2><div id="load-slots"></div><button id="load-back">もどる</button></div>
    </section>

    <section id="clear" class="overlay hidden">
      <div class="clear-card"><p>CHAPTER 1 COMPLETE</p><h2>空色の騎士団長</h2><div class="fragment">✦</div><strong>ハッピーオーラの欠片を手に入れた！</strong><span id="clear-info"></span><div class="row"><button id="clear-save" class="primary">冒険の書に記録</button><button id="clear-title">タイトルへ</button></div></div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <div id="touch" class="touch hidden">
      <div class="dpad">
        <button data-dir="up">▲</button><button data-dir="left">◀</button>
        <button data-dir="right">▶</button><button data-dir="down">▼</button>
      </div>
      <div class="actions"><button id="touch-menu">MENU</button><button id="touch-b">B</button><button id="touch-a" class="primary">A</button></div>
    </div>
  </section>
  <p class="help">移動：矢印 / WASD　決定：Enter / Z / Space　メニュー：Esc / X / M</p>
</main>
<script type="module" src="./data.js"></script>
<script type="module" src="./game.js"></script>
</body>
</html>
