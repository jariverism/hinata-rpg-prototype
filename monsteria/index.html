e,img:d.img,l,hp:m,max:m,atk:d.atk+l}}let s={started:false,mode:'map',x:6,y:20,dir:'u',balls:6,party:[mon('leaf',5)],active:0,enemy:null,lock:false,steps:0};function save(){try{localStorage.setItem('monsteria_mobile4',JSON.stringify({...s,enemy:null,mode:'map',lock:false}))}catch(e){}}function load(){try{let v=JSON.parse(localStorage.getItem('monsteria_mobile4'));if(v&&v.party&&v.party.length){s=v;s.started=false;s.mode='map';s.enemy=null;s.lock=false}}catch(e){}}function tile(x,y){return rows[y]&&rows[y][x]||'#'}function pass(q){return q!=='#'&&q!=='~'}function draw(){c.clearRect(0,0,520,900);for(let y=0;y<22;y++)for(let x=0;x<13;x++){let q=tile(x,y),px=x*T,py=y*T,col=q==='#'?'#315b31':q==='~'?'#53a8dc':q==='g'?'#79c95c':q==='h'?'#bf8a55':'#8bd16b';c.fillStyle=col;c.fillRect(px,py,T,T);if(q==='g'){c.fillStyle='#3c8e3d';for(let i=0;i<4;i++)c.fillRect(px+6+i*9,py+20+(i%2)*5,3,14)}if(q==='#'){c.fillStyle='#254b27';c.fillRect(px+4,py+4,32,32)}if(q==='~'){c.strokeStyle='#d1f1ff';c.beginPath();c.moveTo(px+3,py+17);c.lineTo(px+36,py+17);c.stroke()}}let px=s.x*T+20,py=s.y*T+20;c.fillStyle='#29477f';c.fillRect(px-11,py-10,22,21);c.fillStyle='#f1ba83';c.fillRect(px-8,py-22,16,13);c.fillStyle='#ef3d52';c.fillRect(px-12,py-27,24,7);c.fillStyle='#182748';c.fillRect(px-10,py+11,8,13);c.fillRect(px+2,py+11,8,13)}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1400)}function move(d){if(!s.started||s.mode!=='map'||s.lock||$('panel').classList.contains('on'))return;s.dir=d;let dx=d==='l'?-1:d==='r'?1:0,dy=d==='u'?-1:d==='d'?1:0,nx=s.x+dx,ny=s.y+dy;if(pass(tile(nx,ny))){s.x=nx;s.y=ny;s.steps++;if(tile(nx,ny)==='g'&&Math.random()<.19)startBattle();if(s.steps%6===0)save()}draw()}function active(){return s.party[s.active]}function startBattle(){let k=Math.random()<.14?'wolf':'leaf',l=k==='wolf'?6+Math.floor(Math.random()*4):2+Math.floor(Math.random()*5);s.enemy=mon(k,l);s.mode='battle';update();$('battle').classList.add('on');$('bt').textContent='野生の '+s.enemy.name+'が現れた！'}function update(){let p=active(),e=s.enemy;if(!p||!e)return;$('en').textContent=e.name;$('el').textContent='Lv.'+e.l;$('eh').style.width=Math.max(0,e.hp/e.max*100)+'%';$('enemyMon').innerHTML='<img src="'+e.img+'">';$('mn').textContent=p.name;$('ml').textContent='Lv.'+p.l;$('mh').style.width=Math.max(0,p.hp/p.max*100)+'%';$('mht').textContent='HP '+p.hp+'/'+p.max;$('myMon').innerHTML='<img src="'+p.img+'">'}function damage(a,b){return Math.max(2,Math.floor(a.atk*(.75+Math.random()*.4)-b.l*.35))}function disable(v){['attack','capture','swap','run'].forEach(x=>$(x).disabled=v)}function end(){s.mode='map';s.enemy=null;s.lock=false;disable(false);$('battle').classList.remove('on');draw();save()}async function attack(){if(s.lock)return;s.lock=true;disable(true);let p=active(),e=s.enemy,d=damage(p,e);e.hp=Math.max(0,e.hp-d);$('bt').textContent=p.name+'の攻撃！ '+d+'ダメージ';update();await wait(550);if(e.hp<=0){$('bt').textContent=e.name+'を倒した！';p.l+=Math.random()<.28?1:0;p.max=dex[p.k].hp+p.l*3;p.hp=Math.min(p.max,p.hp+5);await wait(650);end();return}d=damage(e,p);p.hp=Math.max(0,p.hp-d);$('bt').textContent=e.name+'の反撃！ '+d+'ダメージ';update();await wait(550);if(p.hp<=0){let n=s.party.findIndex(m=>m.hp>0);if(n<0){s.party.forEach(m=>m.hp=m.max);s.x=6;s.y=20;toast('全員回復して草原へ戻った');end();return}s.active=n;update()}s.lock=false;disable(false);save()}async function capture(){if(s.lock)return;if(s.balls<1){$('bt').textContent='カプセルがない！';return}s.lock=true;disable(true);s.balls--;$('balls').textContent=s.balls;$('bt').textContent='カプセルを投げた！';await wait(650);let e=s.enemy,rate=dex[e.k].rate*(1-e.hp/e.max*.65);if(Math.random()<rate){s.party.push(mon(e.k,e.l));$('bt').textContent=e.name+'を仲間にした！';await wait(750);end()}else{$('bt').textContent='飛び出した！';await wait(450);s.lock=false;disable(false);save()}}function render(inBattle=false){$('list').innerHTML='';s.party.forEach((m,i)=>{let d=document.createElement('div');d.className='member';d.innerHTML='<img src="'+m.img+'"><div class="info"><b>'+(i===s.active?'★ ':'')+m.name+' Lv.'+m.l+'</b><div>HP '+m.hp+'/'+m.max+'　ATK '+m.atk+'</div></div><button>先頭</button>';d.querySelector('button').onclick=()=>{if(m.hp<=0){toast('戦える元気がない');return}s.active=i;save();if(inBattle){$('panel').classList.remove('on');update();$('bt').textContent=m.name+'に交代した！'}else render(false)};$('list').appendChild(d)});$('panel').classList.add('on')}const wait=ms=>new Promise(r=>setTimeout(r,ms));$('start').onclick=()=>{load();s.started=true;$('title').classList.remove('on');$('balls').textContent=s.balls;draw();toast('十字キーで移動しよう！')};document.querySelectorAll('[data-d]').forEach(b=>{let tm;b.onpointerdown=e=>{e.preventDefault();move(b.dataset.d);clearInterval(tm);tm=setInterval(()=>move(b.dataset.d),175)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>clearInterval(tm)});$('party').onclick=()=>render(false);$('close').onclick=()=>$('panel').classList.remove('on');$('a').onclick=()=>toast('草むらを探してみよう');$('attack').onclick=attack;$('capture').onclick=capture;$('swap').onclick=()=>render(true);$('run').onclick=()=>{if(!s.lock){$('bt').textContent='逃げ出した！';setTimeout(end,350)}};draw()})();</script></body></html>
