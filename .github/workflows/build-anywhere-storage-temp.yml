name: Build Anywhere Storage Canary

on:
  push:
    branches:
      - build-anywhere-storage-20260902
    paths:
      - 'tools/anywhere-storage/**'
      - '.github/workflows/build-anywhere-storage-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download BepInEx IL2CPP references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/anywhere-storage/lib
          curl -L --fail --retry 3 \
            'https://github.com/BepInEx/BepInEx/releases/download/v6.0.0-pre.2/BepInEx-Unity.IL2CPP-win-x64-6.0.0-pre.2.zip' \
            -o /tmp/bepinex.zip
          unzip -q /tmp/bepinex.zip -d tools/anywhere-storage/lib
          test -f tools/anywhere-storage/lib/BepInEx/core/BepInEx.Unity.IL2CPP.dll
          test -f tools/anywhere-storage/lib/BepInEx/core/0Harmony.dll

      - name: Build plugin
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/anywhere-storage/HinataS1AnywhereStorage.csproj -c Release

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp tools/anywhere-storage/bin/Release/net6.0/HinataS1AnywhereStorage.dll artifact/
          sha256sum artifact/HinataS1AnywhereStorage.dll > artifact/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HinataS1AnywhereStorage-canary-v0.1.0
          path: artifact/
          if-no-files-found: error
          retention-days: 7
