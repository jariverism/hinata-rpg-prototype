name: Sangokushi ROGUE regression
on:
  push:
    paths:
      - 'sangokushi/rogue/**'
      - '.github/workflows/sangokushi-rogue-regression.yml'
  pull_request:
    paths:
      - 'sangokushi/rogue/**'
      - '.github/workflows/sangokushi-rogue-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: find sangokushi/rogue -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: ROGUE rules regression
        run: node sangokushi/rogue/tests/rogue_rules_test.cjs
      - name: Canonical stat engine v6 regression
        run: node sangokushi/rogue/tests/stat_engine_model_test.cjs
      - name: Start-city guard regression
        run: grep -q 'rogue_start_fix.js?v=2' sangokushi/rogue/index.html
      - name: Entry point references
        run: |
          grep -q 'rogue.js?v=6' sangokushi/rogue/index.html
          grep -q 'rogue_stat_engine_v6.js?v=6' sangokushi/rogue/index.html
          ! grep -q 'rogue_stat_guard.js' sangokushi/rogue/index.html
          ! grep -q 'rogue_stat_engine.js?v=' sangokushi/rogue/index.html
          grep -q '../v24/v24_73_pressure.js?v=6' sangokushi/rogue/index.html
          grep -q 'Prototype 0.6' sangokushi/rogue/index.html
          grep -q 'no-store, no-cache' sangokushi/rogue/index.html
          grep -q '日向三國志 ROGUE' sangokushi/rogue/index.html
