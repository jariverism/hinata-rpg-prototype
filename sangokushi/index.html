<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日向三国志 改</title>
<style>
:root{--paper:#f4ead0;--panel:#fffaf0;--gold:#b68b3b;--red:#7e281c;--ink:#2c1c12}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--paper);color:var(--ink)}
header{position:sticky;top:0;z-index:10;padding:11px 12px;background:linear-gradient(100deg,#3a150d,#982f20);color:#fff3ce;border-bottom:4px solid var(--gold)}
h1{font-size:21px;margin:0}.sub{font-size:12px;margin-top:3px}.top{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
button{border:0;border-radius:10px;min-height:44px;padding:10px 12px;margin:3px;background:var(--red);color:white;font-weight:800;font-size:14px;touch-action:manipulation}
.top button{background:#fff0c6;color:#4b2117}
main{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;gap:10px;max-width:1450px;margin:auto;padding:10px}
.panel{background:var(--panel);border:2px solid var(--gold);border-radius:13px;padding:10px}
h2{font-size:17px;margin:0 0 8px;border-bottom:2px solid #d9bd7c;padding-bottom:5px}
h3{font-size:14px;margin:10px 0 5px}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.city{min-height:135px;border:2px solid #c8ae78;border-radius:10px;padding:8px;background:#fff;touch-action:manipulation}
.city.mine{background:#edf7ff}.city.enemy{background:#fff0ec}.city.sel{outline:4px solid #2784c5}
.name{font-weight:900;font-size:18px}.badge{display:inline-block;border-radius:99px;padding:2px 7px;color:white;font-size:10px}
.久美軍{background:#2d7fb5}.曹操軍{background:#9b3026}.劉備軍{background:#39894f}.孫権軍{background:#a8761b}.袁紹軍{background:#6e4aa3}.在野{background:#777}
.stats,.small{font-size:12px;line-height:1.5}.commands{display:flex;flex-wrap:wrap}.commands button{flex:1 1 42%}
.officer{border-bottom:1px dashed #c9ae78;padding:7px 0;font-size:12px}.officer b{font-size:14px}.skill{color:#8b2c1d;font-weight:800}
.log{height:420px;overflow:auto;background:#1d130e;color:#ffe3aa;border-radius:10px;padding:9px;font-size:12px;white-space:pre-wrap;line-height:1.55}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:30;padding:15px}.modal.on{display:grid}
.card{background:#fff8e8;border:3px solid var(--gold);border-radius:16px;max-width:540px;width:100%;padding:16px;max-height:86vh;overflow:auto}
.choice button{display:block;width:100%;margin:7px 0}.muted{color:#776a5e;font-size:11px}
@media(max-width:900px){main{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}.log{height:240px}}
@media(max-width:520px){main{display:flex;flex-direction:column;padding:6px}.center{order:1}.left{order:2}.right{order:3}.map{grid-template-columns:1fr 1fr;gap:6px}.city{min-height:155px}.commands{position:sticky;bottom:0;background:var(--panel);z-index:8;padding:5px 0 calc(5px + env(safe-area-inset-bottom));border-top:2px solid var(--gold)}}
</style>
</head>
<body>
<header>
<h1>日向三国志 改</h1>
<div class="sub">武将を動かし、捜索し、策略と登用で天下を取れ</div>
<div class="top">
<button data-a="save">保存</button><button data-a="load">読込</button><button data-a="restart">最初から</button>
</div>
</header>
<main>
<section class="panel left"><h2>軍勢</h2><div id="status"></div><h3>命令</h3><div id="commands" class="commands"></div><div class="small">都市ごとに月1回行動。武将移動は武将ごとに月1回。</div><h3>配下武将</h3><div id="roster"></div></section>
<section class="panel center"><h2>中原地図</h2><div id="map" class="map"></div></section>
<section class="panel right"><h2>軍記</h2><div id="log" class="log"></div></section>
</main>
<div id="modal" class="modal"><div class="card" id="modalBody"></div></div>
<script>
const C0={
北平:{r:"久美軍",g:500,f:900,s:4200,l:78,d:45,t:48,n:["鄴","洛陽"]},
鄴:{r:"袁紹軍",g:650,f:950,s:6500,l:68,d:58,t:55,n:["北平","洛陽"]},
洛陽:{r:"曹操軍",g:850,f:1200,s:9000,l:75,d:72,t:66,n:["北平","鄴","許昌","江陵"]},
許昌:{r:"曹操軍",g:720,f:980,s:7800,l:73,d:66,t:61,n:["洛陽","建業","江陵"]},
建業:{r:"孫権軍",g:680,f:960,s:7200,l:79,d:64,t:59,n:["許昌","江陵"]},
江陵:{r:"劉備軍",g:520,f:880,s:6400,l:84,d:57,t:58,n:["洛陽","許昌","建業","成都"]},
成都:{r:"劉備軍",g:560,f:1100,s:7000,l:88,d:62,t:55,n:["江陵"]}
};
const O0=[
{name:"佐々木久美",f:"久美軍",c:"北平",lead:94,war:79,int:86,pol:87,cha:100,loy:100,skill:"キャプテンの檄"},
{name:"加藤史帆",f:"久美軍",c:"北平",lead:82,war:86,int:88,pol:83,cha:98,loy:100,skill:"へにょへにょ強襲"},
{name:"濱岸ひより",f:"在野",c:"北平",lead:76,war:75,int:79,pol:76,cha:91,loy:45,skill:"自由な風"},
{name:"小坂菜緒",f:"在野",c:"鄴",lead:93,war:80,int:97,pol:91,cha:99,loy:48,skill:"静謐の策"},
{name:"金村美玖",f:"袁紹軍",c:"鄴",lead:76,war:72,int:91,pol:97,cha:95,loy:70,skill:"黄金勘定"},
{name:"齊藤京子",f:"曹操軍",c:"洛陽",lead:89,war:85,int:94,pol:80,cha:96,loy:86,skill:"低音の威圧"},
{name:"上村ひなの",f:"在野",c:"洛陽",lead:73,war:62,int:100,pol:88,cha:94,loy:42,skill:"変化球計略"},
{name:"富田鈴花",f:"曹操軍",c:"許昌",lead:90,war:90,int:82,pol:70,cha:88,loy:68,skill:"高速進軍"},
{name:"髙橋未来虹",f:"孫権軍",c:"建業",lead:96,war:90,int:84,pol:75,cha:90,loy:79,skill:"大将の器"},
{name:"丹生明里",f:"在野",c:"建業",lead:82,war:80,int:86,pol:84,cha:98,loy:45,skill:"笑顔の陣"},
{name:"松田好花",f:"劉備軍",c:"江陵",lead:79,war:67,int:95,pol:98,cha:93,loy:83,skill:"万能奉行"},
{name:"河田陽菜",f:"在野",c:"成都",lead:65,war:60,int:78,pol:83,cha:99,loy:40,skill:"天然慰撫"},
{name:"東村芽依",f:"劉備軍",c:"成都",lead:86,war:95,int:64,pol:57,cha:90,loy:81,skill:"猫突撃"}
];
const SEARCH_POOL=[
{name:"正源司陽子",lead:88,war:84,int:86,pol:78,cha:96,skill:"陽子の突破"},
{name:"藤嶌果歩",lead:80,war:76,int:84,pol:82,cha:97,skill:"かほりんスマイル"},
{name:"山下葉留花",lead:77,war:72,int:91,pol:90,cha:90,skill:"はるはる機略"},
{name:"平尾帆夏",lead:78,war:69,int:94,pol:92,cha:91,skill:"軍師の眼"},
{name:"宮地すみれ",lead:86,war:88,int:80,pol:72,cha:94,skill:"すみれ突撃"},
{name:"石塚瑶季",lead:84,war:82,int:82,pol:79,cha:93,skill:"全力応援"}
];
let cities,officers,turn,selected,logs,found,over;
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
const clone=x=>JSON.parse(JSON.stringify(x));
function reset(){cities=clone(C0);officers=clone(O0);turn=1;selected="北平";logs=[];found=[];over=false;addLog("北平に久美軍が旗揚げした。人材と策略を活用せよ。");render();}
function mine(){return Object.keys(cities).filter(x=>cities[x].r==="久美軍")}
function ownOfficers(city){return officers.filter(o=>o.f==="久美軍"&&(!city||o.c===city))}
function allAt(city){return officers.filter(o=>o.c===city)}
function addLog(t){logs.unshift("【"+turn+"月】"+t);logs=logs.slice(0,100)}
function best(city,stat,force="久美軍"){return officers.filter(o=>o.c===city&&o.f===force).sort((a,b)=>b[stat]-a[stat])[0]}
function badge(f){return '<span class="badge '+f+'">'+f+'</span>'}
function render(){
const c=cities[selected];
q("#status").innerHTML="<b>"+turn+"月</b>　支配 "+mine().length+"/7都市<br>選択：<b>"+selected+"</b> "+badge(c.r)+"<br>総兵力："+mine().reduce((a,n)=>a+cities[n].s,0).toLocaleString()+"<br>配下："+ownOfficers().length+"人";
q("#roster").innerHTML=ownOfficers().map(o=>'<div class="officer"><b>'+o.name+'</b>（'+o.c+'） 忠誠'+o.loy+'<br>統'+o.lead+' 武'+o.war+' 知'+o.int+' 政'+o.pol+' 魅'+o.cha+'<br><span class="skill">'+o.skill+'</span></div>').join("");
q("#map").innerHTML=Object.entries(cities).map(([n,x])=>'<div class="city '+(x.r==="久美軍"?"mine":"enemy")+' '+(n===selected?"sel":"")+'" data-city="'+n+'"><div class="name">'+n+'</div>'+badge(x.r)+'<div class="stats">金 '+x.g+'　兵糧 '+x.f+'<br>兵 '+x.s.toLocaleString()+'　民忠 '+x.l+'<br>開発 '+x.d+'　訓練 '+x.t+'<br>武将：'+(allAt(n).map(o=>o.name+(o.f==="在野"?"★":"")).join("、")||"なし")+'<br>隣接：'+x.n.join("・")+'</div></div>').join("");
const active=c.r==="久美軍"&&!c.acted&&!over;
q("#commands").innerHTML=[["develop","内政"],["recruit","徴兵"],["train","訓練"],["search","捜索"],["move","武将移動"],["plot","策略"],["hire","敵将登用"],["attack","出兵"],["end","月を進める"]].map(([a,t])=>'<button data-a="'+a+'" '+((a!=="end"&&!active)?"disabled":"")+'>'+t+'</button>').join("");
q("#log").textContent=logs.join("\n");
qa("[data-city]").forEach(e=>e.onclick=()=>{selected=e.dataset.city;render()});
qa("[data-a]").forEach(e=>e.onclick=()=>action(e.dataset.a));
}
function action(a){
if(a==="save"){localStorage.setItem("hinata3k_v3",JSON.stringify({cities,officers,turn,selected,logs,found,over}));addLog("保存した。");render();return}
if(a==="load"){let s=localStorage.getItem("hinata3k_v3");if(!s)return alert("保存データがありません");let d=JSON.parse(s);cities=d.cities;officers=d.officers;turn=d.turn;selected=d.selected;logs=d.logs;found=d.found||[];over=d.over;render();return}
if(a==="restart"){if(confirm("最初からやり直しますか？"))reset();return}
if(a==="end"){endTurn();return}
const c=cities[selected];if(c.r!=="久美軍"||c.acted)return;
if(a==="develop")develop();if(a==="recruit")recruit();if(a==="train")train();if(a==="search")searchCmd();if(a==="move")moveCmd();if(a==="plot")plotCmd();if(a==="hire")hireCmd();if(a==="attack")attackCmd();
}
function mark(){cities[selected].acted=true;render()}
function develop(){let o=best(selected,"pol"),gain=35+Math.floor((o?o.pol:60)/3);cities[selected].d=Math.min(100,cities[selected].d+8);cities[selected].g+=gain;cities[selected].f+=gain;cities[selected].l=Math.min(100,cities[selected].l+3);addLog(selected+"で内政。金・兵糧各"+gain+"、民忠上昇。");mark()}
function recruit(){let c=cities[selected],o=best(selected,"cha"),n=700+Math.floor((o?o.cha:60)*8);if(c.g<100||c.f<120)return alert("金100・兵糧120が必要");c.g-=100;c.f-=120;c.s+=n;addLog(selected+"で"+n+"人を徴兵。");mark()}
function train(){let c=cities[selected],o=best(selected,"lead"),n=8+Math.floor((o?o.lead:60)/20);if(c.f<80)return alert("兵糧80が必要");c.f-=80;c.t=Math.min(100,c.t+n);addLog(selected+"の訓練が"+n+"上昇。");mark()}
function searchCmd(){let c=cities[selected],o=best(selected,"int");if(c.g<60)return alert("金60が必要");c.g-=60;let local=officers.filter(x=>x.c===selected&&x.f==="在野");let roll=Math.random()*100+(o?o.int:60)*.35;if(local.length&&roll>45){let t=local[Math.floor(Math.random()*local.length)];t.f="久美軍";t.loy=70;addLog(o.name+"が"+t.name+"を発見し登用した。")}else if(SEARCH_POOL.length>found.length&&roll>62){let pool=SEARCH_POOL.filter(x=>!found.includes(x.name));let p=pool[Math.floor(Math.random()*pool.length)];found.push(p.name);officers.push({...p,f:"久美軍",c:selected,loy:68});addLog("捜索で"+p.name+"を発見、配下に加えた。")}else if(roll>35){let g=80+Math.floor(Math.random()*180);c.g+=g;addLog("捜索で金"+g+"を発見。")}else addLog("捜索したが成果なし。");mark()}
function modal(title,body){q("#modalBody").innerHTML="<h2>"+title+"</h2>"+body+'<button data-close>閉じる</button>';q("#modal").classList.add("on");q("[data-close]").onclick=()=>q("#modal").classList.remove("on")}
function moveCmd(){let list=ownOfficers(selected).filter(o=>o.moved!==turn);if(!list.length)return alert("移動できる武将がいません");modal("武将移動",'<div class="choice">'+list.map(o=>'<button data-o="'+o.name+'">'+o.name+'を移動</button>').join("")+'</div>');qa("[data-o]").forEach(b=>b.onclick=()=>chooseDest(b.dataset.o))}
function chooseDest(name){modal(name+"の移動先",'<div class="choice">'+mine().filter(x=>x!==selected).map(n=>'<button data-d="'+n+'">'+n+'</button>').join("")+'</div>');qa("[data-d]").forEach(b=>b.onclick=()=>{let o=officers.find(x=>x.name===name);o.c=b.dataset.d;o.moved=turn;addLog(name+"が"+selected+"から"+b.dataset.d+"へ移動。");q("#modal").classList.remove("on");render()})}
function plotCmd(){let c=cities[selected];if(c.g<120)return alert("金120が必要");let targets=c.n.filter(n=>cities[n].r!=="久美軍");if(!targets.length)return alert("隣接敵都市がありません");modal("策略",'<div class="choice">'+targets.flatMap(t=>['<button data-p="rumor" data-t="'+t+'">'+t+'に流言</button>','<button data-p="fire" data-t="'+t+'">'+t+'に焼討</button>','<button data-p="false" data-t="'+t+'">'+t+'に偽報</button>','<button data-p="rift" data-t="'+t+'">'+t+'に離間</button>']).join("")+'</div>');qa("[data-p]").forEach(b=>b.onclick=()=>executePlot(b.dataset.p,b.dataset.t))}
function executePlot(type,t){let c=cities[selected],o=best(selected,"int"),tc=cities[t];c.g-=120;let enemy=officers.filter(x=>x.c===t&&x.f===tc.r),chance=45+(o?o.int:60)*.45-tc.t*.18;if(Math.random()*100<chance){if(type==="rumor"){tc.l=Math.max(20,tc.l-12);enemy.forEach(x=>x.loy=Math.max(20,x.loy-6));addLog(o.name+"の流言が"+t+"で成功。")}if(type==="fire"){let f=180+Math.floor(Math.random()*300),s=400+Math.floor(Math.random()*900);tc.f=Math.max(0,tc.f-f);tc.s=Math.max(500,tc.s-s);addLog(t+"への焼討成功。兵糧"+f+"・兵"+s+"減。")}if(type==="false"){tc.t=Math.max(15,tc.t-18);addLog(t+"への偽報成功。訓練低下。")}if(type==="rift"){enemy.forEach(x=>x.loy=Math.max(15,x.loy-14));addLog(t+"で離間成功。敵将忠誠が大幅低下。")}}else addLog(o.name+"の策略は見破られた。");q("#modal").classList.remove("on");mark()}
function hireCmd(){let c=cities[selected];if(c.g<180)return alert("金180が必要");let targets=officers.filter(o=>o.f!=="久美軍"&&o.f!=="在野");if(!targets.length)return alert("登用対象がいません");modal("敵将登用",'<div class="choice">'+targets.sort((a,b)=>a.loy-b.loy).map(o=>'<button data-h="'+o.name+'">'+o.name+'（'+o.f+'・'+o.c+'・忠誠'+o.loy+'）</button>').join("")+'</div>');qa("[data-h]").forEach(b=>b.onclick=()=>executeHire(b.dataset.h))}
function executeHire(name){let c=cities[selected],envoy=best(selected,"cha"),t=officers.find(o=>o.name===name);c.g-=180;let chance=20+(envoy?envoy.cha:60)*.45+(100-t.loy)*.75-(t.c===selected?0:12);if(Math.random()*100<chance){let old=t.f;t.f="久美軍";t.c=selected;t.loy=60+Math.floor(Math.random()*16);addLog(envoy.name+"が"+old+"の"+t.name+"を引き抜いた。")}else addLog(envoy.name+"の登用を"+t.name+"は拒絶した。");q("#modal").classList.remove("on");mark()}
function attackCmd(){let c=cities[selected],targets=c.n.filter(n=>cities[n].r!=="久美軍");if(!targets.length)return alert("攻撃先がありません");if(c.s<1200)return alert("兵力1200以上必要");modal("出兵",'<div class="choice">'+targets.map(n=>'<button data-at="'+n+'">'+n+'へ出兵（敵兵'+cities[n].s.toLocaleString()+'）</button>').join("")+'</div>');qa("[data-at]").forEach(b=>b.onclick=()=>battle(b.dataset.at))}
function battle(t){let a=cities[selected],d=cities[t],cmd=best(selected,"lead"),enemy=best(t,"lead",d.r);let ap=a.s*(.7+a.t/100)*(1+(cmd?cmd.lead:60)/180),dp=d.s*(.75+d.t/100)*(1+(enemy?enemy.lead:60)/190);let al=Math.floor(d.s*(.22+Math.random()*.22)),dl=Math.floor(a.s*(.24+Math.random()*.28));a.s=Math.max(300,a.s-al);d.s=Math.max(0,d.s-dl);if(ap>dp&&d.s<Math.max(1400,a.s*.55)){let old=d.r;d.r="久美軍";d.s=Math.max(900,Math.floor(a.s*.35));a.s=Math.max(500,Math.floor(a.s*.65));officers.filter(o=>o.c===t&&o.f===old).forEach(o=>o.loy=Math.max(20,o.loy-18));addLog(t+"を攻略した。敵将は降伏せず、忠誠を失った。")}else addLog(t+"への出兵は失敗。久美軍損害"+al+"、敵損害"+dl+"。");q("#modal").classList.remove("on");mark();checkWin()}
function ai(){["袁紹軍","曹操軍","孫権軍","劉備軍"].forEach(force=>{let owns=Object.keys(cities).filter(n=>cities[n].r===force);owns.forEach(n=>{let c=cities[n];c.g+=45;c.f+=60;c.s+=250;c.t=Math.min(100,c.t+2);let weak=c.n.filter(x=>cities[x].r!==force).sort((a,b)=>cities[a].s-cities[b].s)[0];if(weak&&Math.random()<.22&&c.s>cities[weak].s*1.2){let target=cities[weak],loss=Math.floor(c.s*.18),dl=Math.floor(target.s*.45);c.s-=loss;target.s-=dl;if(target.s<900){let old=target.r;target.r=force;target.s=1000;officers.filter(o=>o.c===weak&&o.f===old).forEach(o=>o.loy=Math.max(20,o.loy-15));addLog(force+"が"+weak+"を攻略した。")}}})})}
function endTurn(){Object.values(cities).forEach(c=>{delete c.acted;c.g+=Math.floor(c.d*.8);c.f+=Math.floor(c.d*1.1)});ai();turn++;selected=mine()[0]||selected;addLog("月が進んだ。");checkWin();render()}
function checkWin(){if(mine().length===7){over=true;addLog("天下統一。日向のハッピーオーラが中原を包んだ。")}}
q("#modal").onclick=e=>{if(e.target.id==="modal")q("#modal").classList.remove("on")};
reset();
</script>
</body>
</html>
