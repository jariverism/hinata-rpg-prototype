<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日向三国志・天下のハッピーオーラ</title><style>
:root{--ink:#25170f;--paper:#f3ead4;--panel:#fffaf0;--gold:#c59a42;--red:#7f2418;--blue:#2d7fbd}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:radial-gradient(circle at 50% 0,#fff8e8,var(--paper));color:var(--ink)}header{position:sticky;top:0;z-index:5;background:linear-gradient(100deg,#3e180f,#982d1e);color:#fff4d4;border-bottom:4px solid var(--gold);padding:12px 14px;box-shadow:0 3px 12px #0005}h1{font-size:22px;margin:0}.sub{font-size:12px;opacity:.9;margin-top:4px}.topbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.topbar button{background:#fff2cf;color:#4d2116}.layout{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;gap:10px;padding:10px;max-width:1450px;margin:auto}.panel{background:var(--panel);border:2px solid #b58a42;border-radius:13px;padding:11px;box-shadow:0 4px 12px #5c351522}h2{font-size:17px;margin:0 0 8px;border-bottom:2px solid #d8ba79;padding-bottom:5px}h3{font-size:14px;margin:11px 0 5px}button{border:0;border-radius:10px;background:var(--red);color:#fff;min-height:44px;padding:11px 12px;margin:3px;font-weight:800;font-size:14px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none;-webkit-user-select:none}button:disabled{opacity:.38}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.city{min-height:126px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;border:2px solid #cbb17c;border-radius:11px;padding:8px;background:#fff;cursor:pointer;position:relative}.city.sel{outline:4px solid #2d8ac8}.city.enemy{background:#fff0ec}.city.mine{background:#edf7ff}.city .name{font-size:18px;font-weight:900}.badge{display:inline-block;color:#fff;border-radius:999px;padding:2px 7px;font-size:10px}.久美軍{background:#2980b9}.曹操軍{background:#9e2c24}.劉備軍{background:#33894a}.孫権軍{background:#ae7b17}.袁紹軍{background:#7148a8}.在野{background:#777}.stats{font-size:12px;line-height:1.5;margin-top:5px}.officer{border-bottom:1px dashed #c9ae78;padding:7px 0;font-size:12px}.officer b{font-size:14px}.skill{color:#8d2c1e;font-weight:800}.commands{display:flex;flex-wrap:wrap}.log{height:410px;overflow:auto;background:#1d130e;color:#ffe2a7;border-radius:10px;padding:9px;font-size:12px;white-space:pre-wrap;line-height:1.55}.event{background:#fff1bd;border:2px solid #d29c28;border-radius:10px;padding:9px;margin-bottom:8px}.small{font-size:11px;color:#6a594c}.meter{height:8px;background:#e4d8c2;border-radius:99px;overflow:hidden;margin:3px 0}.meter i{display:block;height:100%;background:#a83825}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20;padding:16px}.modal.on{display:grid}.card{background:#fff8e9;border:3px solid #c59a42;border-radius:16px;max-width:520px;width:100%;padding:18px;max-height:85vh;overflow:auto}.card h2{font-size:22px}.choices button{display:block;width:100%;margin:7px 0;background:#6d2c1d}.victory{font-size:21px;color:#9a2d1b;font-weight:900}@media(max-width:920px){.layout{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}.log{height:250px}}@media(max-width:520px){header{position:sticky}.layout{display:flex;flex-direction:column;padding:6px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}.layout>section:nth-child(2){order:1}.layout>section:nth-child(1){order:2}.layout>section:nth-child(3){order:3}.map{grid-template-columns:1fr 1fr;gap:6px}.city{min-height:145px;padding:8px}.city .name{font-size:17px}.panel{padding:9px}.commands{position:sticky;bottom:0;z-index:4;background:#fffaf0;border-top:2px solid #c59a42;padding:6px 0 calc(6px + env(safe-area-inset-bottom));margin:0 -4px}.commands button{flex:1 1 44%;font-size:14px;padding:11px 8px}.topbar button{min-height:40px}.log{height:220px}}
</style></head><body><header><h1>日向三国志　天下のハッピーオーラ</h1><div class="sub">佐々木久美率いる日向武将を集め、中原七都市を統一せよ</div><div class="topbar"><button type="button" data-action="save">保存</button><button type="button" data-action="load">読込</button><button type="button" data-action="restart">最初から</button></div></header><main class="layout"><section class="panel"><h2>軍勢</h2><div id="status"></div><h3>命令</h3><div id="commands" class="commands"></div><div class="small">自軍都市を選んで命令。各都市は1ターンに1回行動できます。</div><h3>配下武将</h3><div id="roster"></div></section><section class="panel"><h2>中原地図</h2><div id="event"></div><div id="map" class="map"></div></section><section class="panel"><h2>軍記</h2><div id="log" class="log"></div></section></main><div id="modal" class="modal"><div class="card"><div id="modalBody"></div></div></div><script>
const F={"久美軍":1,"曹操軍":1,"劉備軍":1,"孫権軍":1,"袁紹軍":1,"在野":1};
const baseCities={北平:{r:"久美軍",g:420,f:720,s:3600,l:78,d:42,t:44,n:["鄴","洛陽"]},鄴:{r:"袁紹軍",g:580,f:850,s:6500,l:69,d:58,t:50,n:["北平","洛陽"]},洛陽:{r:"曹操軍",g:800,f:1150,s:9200,l:74,d:72,t:64,n:["北平","鄴","許昌","江陵"]},許昌:{r:"曹操軍",g:700,f:990,s:8200,l:72,d:67,t:60,n:["洛陽","建業","江陵"]},建業:{r:"孫権軍",g:640,f:930,s:7400,l:78,d:63,t:57,n:["許昌","江陵"]},江陵:{r:"劉備軍",g:470,f:820,s:6300,l:84,d:55,t:58,n:["洛陽","許昌","建業","成都"]},成都:{r:"劉備軍",g:510,f:1080,s:7100,l:88,d:61,t:54,n:["江陵"]}};
const baseOfficers=[
{name:"佐々木久美",f:"久美軍",c:"北平",lead:94,war:79,int:86,pol:87,cha:100,loy:100,skill:"キャプテンの檄",desc:"出陣時、味方兵力と訓練を底上げ"},
{name:"加藤史帆",f:"久美軍",c:"北平",lead:82,war:86,int:88,pol:83,cha:98,loy:100,skill:"へにょへにょ強襲",desc:"登用と奇襲に強い"},
{name:"濱岸ひより",f:"在野",c:"北平",lead:76,war:75,int:79,pol:76,cha:91,loy:45,skill:"自由な風",desc:"序盤に登用しやすい"},
{name:"小坂菜緒",f:"在野",c:"鄴",lead:93,war:80,int:97,pol:91,cha:99,loy:48,skill:"静謐の策",desc:"戦力差を覆す軍師"},
{name:"金村美玖",f:"袁紹軍",c:"鄴",lead:76,war:72,int:91,pol:97,cha:95,loy:75,skill:"黄金勘定",desc:"内政収入が大幅増"},
{name:"齊藤京子",f:"曹操軍",c:"洛陽",lead:89,war:85,int:94,pol:80,cha:96,loy:88,skill:"低音の威圧",desc:"敵士気を削る"},
{name:"上村ひなの",f:"在野",c:"洛陽",lead:73,war:62,int:100,pol:88,cha:94,loy:42,skill:"変化球計略",desc:"結果が大きく振れる策"},
{name:"富田鈴花",f:"曹操軍",c:"許昌",lead:90,war:90,int:82,pol:70,cha:88,loy:70,skill:"高速進軍",desc:"攻撃時に先制補正"},
{name:"髙橋未来虹",f:"孫権軍",c:"建業",lead:96,war:90,int:84,pol:75,cha:90,loy:80,skill:"大将の器",desc:"大軍ほど強い"},
{name:"丹生明里",f:"在野",c:"建業",lead:82,war:80,int:86,pol:84,cha:98,loy:45,skill:"笑顔の陣",desc:"民忠と士気を回復"},
{name:"松田好花",f:"劉備軍",c:"江陵",lead:79,war:67,int:95,pol:98,cha:93,loy:84,skill:"万能奉行",desc:"全ての内政に補正"},
{name:"河田陽菜",f:"在野",c:"成都",lead:65,war:60,int:78,pol:83,cha:99,loy:40,skill:"天然慰撫",desc:"民忠を大きく上げる"},
{name:"東村芽依",f:"劉備軍",c:"成都",lead:86,war:95,int:64,pol:57,cha:90,loy:82,skill:"猫突撃",desc:"攻城戦で武力補正"}
];
let turn,cities,officers,selected,over,logs,eventText;
function cloneData(v){return JSON.parse(JSON.stringify(v))}
function resetState(){turn=1;cities=cloneData(baseCities);officers=cloneData(baseOfficers);selected="北平";over=false;logs=[];eventText="黄巾の残党が北方を荒らしている。まずは北平の地盤を固めよう。"}
function mine(){return Object.keys(cities).filter(x=>cities[x].r==="久美軍")}function ofs(city,force){return officers.filter(o=>o.c===city&&(!force||o.f===force))}function army(){return officers.filter(o=>o.f==="久美軍")}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:55}function best(city,stat,force="久美軍"){return ofs(city,force).sort((a,b)=>b[stat]-a[stat])[0]}
function addLog(s){logs.unshift(`【${turn}月】${s}`);logs=logs.slice(0,80)}function badge(f){return `<span class="badge ${f}">${f}</span>`}
function render(){const c=cities[selected];document.getElementById("status").innerHTML=`<b>${turn}月</b>　支配 ${mine().length}/7都市<br>選択：<b>${selected}</b> ${badge(c.r)}<br>総兵力：${mine().reduce((a,x)=>a+cities[x].s,0).toLocaleString()}<br>配下：${army().length}人`;
document.getElementById("roster").innerHTML=army().map(o=>`<div class="officer"><b>${o.name}</b>（${o.c}）<br>統${o.lead} 武${o.war} 知${o.int} 政${o.pol} 魅${o.cha}<br><span class="skill">${o.skill}</span>：${o.desc}</div>`).join("");
document.getElementById("event").innerHTML=eventText?`<div class="event"><b>今月の情勢</b><br>${eventText}</div>`:"";
document.getElementById("map").innerHTML=Object.entries(cities).map(([n,x])=>`<div class="city ${x.r==="久美軍"?"mine":"enemy"} ${n===selected?"sel":""}" role="button" tabindex="0" data-city="${n}"><div class="name">${n}</div>${badge(x.r)}<div class="stats">金 ${x.g}　兵糧 ${x.f}<br>兵 ${x.s.toLocaleString()}　民忠 ${x.l}<br>開発 ${x.d}　訓練 ${x.t}<div class="meter"><i style="width:${Math.min(100,x.s/100)}%"></i></div>武将：${ofs(n).map(o=>o.name+(o.f==="在野"?"★":"")).join("、")||"なし"}<br>隣接：${x.n.join("・")}</div></div>`).join("");
let dis=c.r!=="久美軍"||c.acted||over;let targets=c.n.filter(n=>cities[n].r!=="久美軍");document.getElementById("commands").innerHTML=`<button type="button" data-action="develop" ${dis?"disabled":""}>内政</button><button type="button" data-action="recruit" ${dis?"disabled":""}>徴兵</button><button type="button" data-action="train" ${dis?"disabled":""}>訓練</button><button type="button" data-action="hire" ${dis?"disabled":""}>登用</button>${targets.map(n=>`<button type="button" data-action="attack" data-target="${n}" ${dis?"disabled":""}>${n}へ出陣</button>`).join("")}<button type="button" data-action="next" ${over?"disabled":""}>ターン終了</button>`;document.getElementById("log").textContent=logs.join("\n");checkEnd()}
function act(){cities[selected].acted=true;render()}function develop(){let c=cities[selected],p=avg(ofs(selected,"久美軍").map(o=>o.pol)),bonus=officers.some(o=>o.f==="久美軍"&&o.c===selected&&o.name==="金村美玖")?1.5:1;let inc=Math.floor((10+p/10+Math.random()*8)*bonus);c.d=Math.min(100,c.d+Math.floor(inc/3));c.g+=inc*5;c.f+=inc*7;c.l=Math.min(100,c.l+3);addLog(`${selected}で内政。金+${inc*5}、兵糧+${inc*7}。`);act()}function recruit(){let c=cities[selected];if(c.g<100||c.f<80)return popup("資金不足","徴兵には金100・兵糧80が必要だ。",[{t:"戻る"}]);let cha=avg(ofs(selected,"久美軍").map(o=>o.cha));let n=Math.floor(550+cha*5+Math.random()*450);c.g-=100;c.f-=80;c.s+=n;c.l=Math.max(40,c.l-3);addLog(`${selected}で${n}人を徴兵。`);act()}function trainCity(){let c=cities[selected];if(c.g<70)return popup("資金不足","訓練には金70が必要だ。",[{t:"戻る"}]);let lead=avg(ofs(selected,"久美軍").map(o=>o.lead)),n=Math.floor(8+lead/18+Math.random()*5);c.g-=70;c.t=Math.min(100,c.t+n);addLog(`${selected}で軍を訓練。訓練度+${n}。`);act()}
function hire(){let cand=ofs(selected).filter(o=>o.f!=="久美軍");if(!cand.length){addLog(`${selected}に登用できる武将はいなかった。`);return act()}let recruiter=best(selected,"cha")||army().sort((a,b)=>b.cha-a.cha)[0];let o=cand[Math.floor(Math.random()*cand.length)];let base=o.f==="在野"?62:Math.max(8,45-o.loy/2);let chance=base+(recruiter?recruiter.cha-80:0)+(recruiter?.name==="加藤史帆"?18:0);if(Math.random()*100<chance){o.f="久美軍";o.loy=88;addLog(`${recruiter.name}が${o.name}を登用！「久美軍にハッピーオーラを！」`);popup("武将加入",`<b>${o.name}</b>が仲間になった！<br><span class="skill">${o.skill}</span>：${o.desc}`,[{t:"よし！"}])}else addLog(`${recruiter?.name||"使者"}が${o.name}を説得したが、登用には至らなかった。`);act()}
function attack(target){let a=cities[selected],d=cities[target];if(a.s<1200||a.f<120)return popup("出陣不可","兵1200・兵糧120以上が必要。",[{t:"戻る"}]);let cmd=best(selected,"lead"),str=best(selected,"war");let send=Math.floor(a.s*.72);let atk=send*(.65+a.t/180)*(1+(cmd?.lead||60)/250)*(1+(str?.war||60)/320);if(cmd?.name==="佐々木久美")atk*=1.12;if(str?.name==="東村芽依")atk*=1.12;if(str?.name==="髙橋未来虹"&&send>5000)atk*=1.1;if(str?.name==="富田鈴花")atk*=1.08;let def=d.s*(.72+d.t/170)*(1+d.l/300);let luck=.82+Math.random()*.38;a.s-=send;a.f-=120;let win=atk*luck>def;if(win){let loss=Math.floor(send*(.16+Math.random()*.18)),remain=send-loss,old=d.r;d.r="久美軍";d.s=Math.max(700,remain);d.l=55;d.t=Math.max(35,a.t-8);a.acted=true;officers.filter(o=>o.c===target&&o.f===old).forEach(o=>{if(Math.random()<.28){o.f="在野";o.loy=45}});addLog(`${cmd?.name||"久美軍"}、${target}攻略成功！ ${old}を退けた。`);selected=target;popup("攻略成功",`<b>${target}</b>を制圧した！<br>残存兵力 ${d.s.toLocaleString()}`,[{t:"入城"}])}else{let loss=Math.floor(send*(.48+Math.random()*.25));a.s+=Math.max(0,send-loss);d.s=Math.max(500,d.s-Math.floor(send*.25));a.acted=true;addLog(`${target}攻略に失敗。${loss.toLocaleString()}の兵を失った。`);popup("敗北",`${target}の守りを崩せなかった。<br>損害 ${loss.toLocaleString()}`,[{t:"撤退"}])}render()}
function ai(){["曹操軍","劉備軍","孫権軍","袁紹軍"].forEach(force=>{let own=Object.keys(cities).filter(n=>cities[n].r===force);if(!own.length)return;let from=own.sort((a,b)=>cities[b].s-cities[a].s)[0],c=cities[from],targets=c.n.filter(n=>cities[n].r!==force);c.g+=80+Math.floor(c.d*2);c.f+=100+Math.floor(c.d*3);c.s+=300+Math.floor(Math.random()*500);c.t=Math.min(100,c.t+2);if(targets.length&&c.s>7000&&Math.random()<.42){let t=targets[Math.floor(Math.random()*targets.length)],d=cities[t],send=Math.floor(c.s*.55);if(send*(.8+Math.random()*.4)>d.s*(.85+d.t/220)){c.s-=send;d.r=force;d.s=Math.floor(send*.55);d.l=50;addLog(`${force}が${t}を攻略した。`)}else{c.s-=Math.floor(send*.35);d.s=Math.max(500,d.s-Math.floor(send*.18))}}})}
function randomEvent(){const ev=[()=>{mine().forEach(n=>cities[n].g+=120);eventText="商人たちが日向軍の評判を聞きつけた。全支配都市に金120。"},()=>{let n=mine()[Math.floor(Math.random()*mine().length)];cities[n].l=Math.min(100,cities[n].l+10);eventText=`${n}で民衆が「ハッピーオーラ祭」を開催。民忠+10。`},()=>{let n=mine()[Math.floor(Math.random()*mine().length)];cities[n].f=Math.max(0,cities[n].f-180);eventText=`${n}で不作。兵糧-180。`},()=>{eventText="各地で日向武将の噂が広まり、今月の在野武将登用率が上がった気がする。"}];ev[Math.floor(Math.random()*ev.length)]()}
function nextTurn(){turn++;Object.values(cities).forEach(c=>c.acted=false);mine().forEach(n=>{let c=cities[n];c.g+=30+Math.floor(c.d*1.5);c.f+=45+Math.floor(c.d*2);c.f=Math.max(0,c.f-Math.floor(c.s/150));if(c.f===0)c.s=Math.max(500,c.s-250)});ai();randomEvent();addLog("新しい月が始まった。");render()}
function checkEnd(){if(over)return;if(mine().length===7){over=true;document.getElementById("commands").innerHTML="";popup("天下統一",`<div class="victory">天下は、ひとつのハッピーオーラに包まれた。</div><p>佐々木久美は玉座ではなく、全武将が円になれる大広間を作らせた。</p><p>統一達成：${turn}月　配下武将：${army().length}人</p>`,[{t:"もう一度",fn:restart}])}else if(!mine().length){over=true;popup("久美軍滅亡","北平に掲げた青い旗は倒れた。だが、物語は何度でも始められる。",[{t:"再起",fn:restart}])}}
function popup(title,body,choices){document.getElementById("modalBody").innerHTML=`<h2>${title}</h2><div>${body}</div><div class="choices">${choices.map((x,i)=>`<button type="button" data-choice="${i}">${x.t}</button>`).join("")}</div>`;window._choices=choices;document.getElementById("modal").classList.add("on")}function modalChoice(i){document.getElementById("modal").classList.remove("on");let x=window._choices[i];if(x.fn)x.fn()}
function saveGame(){try{localStorage.setItem("hinataSangokushiV3",JSON.stringify({turn,cities,officers,selected,over,logs,eventText}));popup("保存完了","端末内に戦況を保存した。",[{t:"戻る"}])}catch(e){popup("保存できません","Safariのプライベートブラウズ等では保存できない場合があります。",[{t:"戻る"}])}}function loadGame(){let s=localStorage.getItem("hinataSangokushiV3");if(!s)return popup("保存なし","まだ保存データがない。",[{t:"戻る"}]);const data=JSON.parse(s);({turn,cities,officers,selected,over,logs,eventText}=data);render();popup("読込完了",`${turn}月の戦況から再開する。`,[{t:"出陣"}])}function restart(){resetState();addLog("北平に青い旗が翻った。佐々木久美、乱世に立つ。");render()}

function handleAction(el){
 const action=el.dataset.action;
 if(!action||el.disabled)return;
 const actions={save:saveGame,load:loadGame,restart:restart,develop:develop,recruit:recruit,train:trainCity,hire:hire,next:nextTurn};
 if(action==="attack")return attack(el.dataset.target);
 if(actions[action])actions[action]();
}
document.addEventListener("click",function(e){
 const choice=e.target.closest("[data-choice]"); if(choice){modalChoice(Number(choice.dataset.choice));return;}
 const city=e.target.closest("[data-city]"); if(city){selected=city.dataset.city;render();return;}
 const action=e.target.closest("[data-action]"); if(action)handleAction(action);
});
document.addEventListener("keydown",function(e){
 if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-city]")){e.preventDefault();selected=e.target.dataset.city;render();}
});

resetState();addLog("北平に青い旗が翻った。佐々木久美、乱世に立つ。");render();
</script></body></html>
