<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日向三国志 改 v5</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#f4ead0}#msg{position:fixed;top:8px;right:8px;z-index:9;background:#fff4c8;border:2px solid #b68b3b;border-radius:10px;padding:7px 9px;font:700 12px -apple-system,BlinkMacSystemFont,sans-serif;color:#4b2117}</style></head><body><div id="msg">v5：自国在野の登用対応</div><iframe id="game" src="../?v=5"></iframe><script>const f=document.getElementById('game');f.onload=()=>{const w=f.contentWindow;w.eval(`function hireCmd(){let c=cities[selected];let localWanderers=officers.filter(o=>o.f==='在野'&&o.c===selected);let enemyTargets=officers.filter(o=>o.f!=='久美軍'&&o.f!=='在野');let targets=[...localWanderers,...enemyTargets];if(!targets.length)return alert('登用対象がいません');let body='<div class="choice">'+targets.sort((a,b)=>{if(a.f==='在野'&&b.f!=='在野')return -1;if(a.f!=='在野'&&b.f==='在野')return 1;return a.loy-b.loy}).map(o=>{let cost=o.f==='在野'?80:180;let label=o.f==='在野'?'在野・同都市':o.f+'・'+o.c+'・忠誠'+o.loy;return '<button data-h="'+o.name+'">'+o.name+'（'+label+'／金'+cost+'）</button>'}).join('')+'</div>';modal('登用',body);qa('[data-h]').forEach(b=>b.onclick=()=>executeHire(b.dataset.h))}function executeHire(name){let c=cities[selected],envoy=best(selected,'cha'),t=officers.find(o=>o.name===name);let isWanderer=t.f==='在野'&&t.c===selected;let cost=isWanderer?80:180;if(c.g<cost)return alert('金'+cost+'が必要');c.g-=cost;let chance=isWanderer?55+(envoy?envoy.cha:60)*.35+(100-t.loy)*.25:20+(envoy?envoy.cha:60)*.45+(100-t.loy)*.75-(t.c===selected?0:12);chance=Math.min(95,chance);if(Math.random()*100<chance){let old=t.f;t.f='久美軍';t.c=selected;t.loy=isWanderer?70+Math.floor(Math.random()*16):60+Math.floor(Math.random()*16);addLog(envoy.name+'が'+(old==='在野'?'在野の':old+'の')+t.name+'を登用した。')}else addLog(envoy.name+'の登用を'+t.name+'は断った。');q('#modal').classList.remove('on');mark()}const oldRender=render;render=function(){oldRender();qa('[data-a="hire"]').forEach(b=>b.textContent='登用')};render();`);setTimeout(()=>document.getElementById('msg').remove(),2500)};</script></body></html>
