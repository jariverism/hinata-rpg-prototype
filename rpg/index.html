<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>日向坂クエスト 異世界転生編</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<main id="app">
  <section class="frame">
    <header><b>日向坂クエスト</b><span>異世界転生編 v0.1</span></header>
    <div id="status"></div>
    <canvas id="game" width="480" height="384" aria-label="RPGマップ"></canvas>
    <div id="message" class="message">ライブ会場を包んだ光が消えると、そこは見知らぬ王国だった。</div>
    <div id="commands" class="commands hidden"></div>
    <div class="pad">
      <button data-key="up">▲</button>
      <div><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
      <button class="talk" data-key="action">はなす／決定</button>
    </div>
    <p class="help">PC：矢印キー移動・Enterで話す／決定　スマホ：画面下のボタン</p>
  </section>
</main>
<script src="game.js?v=1"></script>
</body>
</html>
