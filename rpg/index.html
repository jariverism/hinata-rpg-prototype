<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>日向坂クエスト 異世界転生編</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main id="app">
  <section class="frame">
    <header><b>日向坂クエスト</b><span>異世界転生編 v0.3</span></header>
    <div id="status"></div>
    <canvas id="game" width="480" height="384" aria-label="RPGマップ"></canvas>
    <div id="message" class="message">マップをタップすると、その場所まで自動で歩きます。</div>
    <div id="commands" class="commands hidden"></div>
    <div class="utility">
      <button id="menuBtn">メニュー</button><button id="saveBtn">セーブ</button><button id="resetBtn">最初から</button>
    </div>
    <div class="pad">
      <button data-key="up">▲</button>
      <div><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
      <button class="talk" data-key="action">はなす／決定</button>
    </div>
    <p class="help">スマホ：行き先・人物・宝箱・ボスを直接タップ　PC：クリックまたは矢印キー</p>
  </section>
</main>
<script src="game.js?v=3"></script>
</body>
</html>
