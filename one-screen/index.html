<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一画面ひなた勇者</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:10px}.wrap{width:min(100%,720px);background:#182230;border:3px solid #e4e7ec;border-radius:14px;padding:10px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}h1{font-size:21px;margin:0}small{color:#98a2b3}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}.stat{background:#0c111d;border:1px solid #475467;border-radius:6px;padding:5px;text-align:center;font-size:12px}.wide{grid-column:span 3}.notice{margin:0 0 8px;padding:7px 9px;border:1px solid #475467;border-radius:7px;background:#101828;font-size:12px;line-height:1.45}canvas{display:block;width:100%;height:auto;border:3px solid #fff;background:#000;image-rendering:pixelated;touch-action:none}.msg{min-height:100px;background:#05070b;border:3px solid #fff;border-radius:7px;margin-top:8px;padding:10px 12px;white-space:pre-line;line-height:1.55}.cmd{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.cmd button,.util button{border:2px solid #fff;border-radius:7px;background:#111827;color:#fff;font-weight:700;padding:11px}.cmd button:disabled{opacity:.35}.util{display:flex;gap:6px;margin-top:8px}.util button{flex:1}.help{font-size:11px;color:#98a2b3;text-align:center;margin:8px 0 0}@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.wide{grid-column:span 3}.notice,.msg{font-size:13px}}</style></head><body><main><section class="wrap"><header><h1>一画面ひなた勇者</h1><small>ルート選択型 v3.0</small></header><div id="stats" class="stats"></div><p id="notice" class="notice"></p><canvas id="game" width="560" height="560"></canvas><div id="msg" class="msg">中央から冒険開始。盤面全体を見て、進む順番を決めよう。</div><div id="cmd" class="cmd"></div><div class="util"><button id="save">セーブ</button><button id="reset">最初から</button></div><p class="help">全マスの内容は最初から見えます。黄色枠の上下左右だけ選択できます。</p></section></main><script>(()=>{'use strict';const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),msg=document.getElementById('msg'),cmd=document.getElementById('cmd'),stats=document.getElementById('stats'),notice=document.getElementById('notice');const N=7,T=80,SAVE='one_screen_hinata_v3';const fresh=()=>({x:3,y:3,hp:42,maxHp:42,mp:10,maxMp:10,atk:9,def:5,lv:1,exp:0,gold:20,smile:0,fragments:0,allies:['佐々木久美'],opened:{'3,3':true},done:{},ended:false,steps:0,newTiles:0,enemyPhase:0,weapon:null,conference:false,wolfDown:false,fastRescues:0});const map=[['wall','kyo','enemy1','chest','wolf','mirei','wall'],['heal','enemy2','quiz','shop','enemy3','katoshi','fragment'],['enemy4','road','enemy5','road','enemy6','inn','enemy7'],['chest2','enemy8','road','start','road','enemy9','shrine'],['enemy10','road','enemy11','road','enemy12','road','enemy13'],['fragment2','enemy14','mirei2','enemy15','kumi','enemy16','boss'],['wall','enemy17','chest3','heal2','enemy18','fragment3','wall']];const data={start:{name:'光の広場',type:'road',color:'#fde68a'},road:{name:'草原',type:'road',color:'#65a30d'},wall:{name:'岩山',type:'wall',color:'#334155'},kyo:{name:'齊藤京子',type:'ally',ally:'齊藤京子',color:'#9333ea',atk:3,mp:5,smile:12,cost:10},katoshi:{name:'加藤史帆',type:'ally',ally:'加藤史帆',color:'#ec4899',def:4,smile:12,locked:'wolf'},mirei:{name:'佐々木美玲',type:'ally',ally:'佐々木美玲',color:'#f59e0b',maxHp:12,hp:12,smile:12},mirei2:{name:'パンの村',type:'reward',color:'#fbbf24',gold:25,smile:8},kumi:{name:'久美の作戦会議',type:'conference',color:'#eab308'},heal:{name:'潮の泉',type:'heal',color:'#0ea5e9'},heal2:{name:'癒やしの泉',type:'heal',color:'#38bdf8'},shop:{name:'武器屋',type:'shop',color:'#b45309'},inn:{name:'宿屋',type:'inn',color:'#16a34a'},quiz:{name:'ひなたクイズ',type:'quiz',color:'#f97316'},shrine:{name:'笑顔の祠',type:'shrine',color:'#fde047'},chest:{name:'宝箱',type:'reward',color:'#a16207',gold:20,smile:5},chest2:{name:'宝箱',type:'reward',color:'#a16207',gold:18,mp:3},chest3:{name:'宝箱',type:'reward',color:'#a16207',gold:35,smile:5},fragment:{name:'光の欠片',type:'fragment',color:'#fef08a'},fragment2:{name:'光の欠片',type:'fragment',color:'#fef08a'},fragment3:{name:'光の欠片',type:'fragment',color:'#fef08a'},wolf:{name:'影オオカミ',type:'enemy',color:'#64748b',hp:48,atk:12,def:3,exp:22,gold:20,special:'wolf'},boss:{name:'魔王',type:'boss',color:'#111827',hp:165,atk:21,def:8}};for(let i=1;i<=18;i++)data['enemy'+i]={name:['ひなたスライム','月影バット','黒い番人'][i%3],type:'enemy',color:['#22c55e','#7c3aed','#334155'][i%3],hp:18+i*4,atk:6+Math.floor(i/2),def:1+Math.floor(i/4),exp:8+i*2,gold:6+i};function key(x,y){return x+','+y}function load(){let v;try{v=JSON.parse(localStorage.getItem(SAVE))}catch(e){}if(!v)return fresh();return Object.assign(fresh(),v,{opened:v.opened||{'3,3':true},done:v.done||{},allies:Array.isArray(v.allies)?v.allies:['佐々木久美']})}let s=load();if(!s.opened[key(s.x,s.y)]){s.x=3;s.y=3;s.opened['3,3']=true}function save(t){localStorage.setItem(SAVE,JSON.stringify(s));if(t)msg.textContent=t}function adjacent(x,y){return Math.abs(x-s.x)+Math.abs(y-s.y)===1}function selectable(x,y){if(x<0||y<0||x>=N||y>=N||!adjacent(x,y))return false;const d=data[map[y][x]];return d.type!=='wall'&&(!!s.opened[key(x,y)]||!s.done[key(x,y)])}function phase(){return s.newTiles>=12?2:s.newTiles>=8?1:0}function enemyMods(){const p=phase();return{hp:1+p*.2,atk:p+(s.conference?-2:0)}}function draw(){ctx.clearRect(0,0,560,560);for(let y=0;y<N;y++)for(let x=0;x<N;x++)drawTile(x,y);drawStats();drawNotice()}function drawTile(x,y){const d=data[map[y][x]],k=key(x,y),open=!!s.opened[k],sel=selectable(x,y),done=!!s.done[k];ctx.fillStyle=open?'#4d7c0f':'#111827';ctx.fillRect(x*T,y*T,T,T);ctx.strokeStyle=sel?'#fde047':'#334155';ctx.lineWidth=sel?5:1;ctx.strokeRect(x*T+2,y*T+2,T-4,T-4);ctx.globalAlpha=done?.42:1;ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(x*T+40,y*T+31,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';wrap(d.name,x*T+40,y*T+62,72);ctx.globalAlpha=1;if(done){ctx.fillStyle='#d9f99d';ctx.font='bold 18px sans-serif';ctx.fillText('済',x*T+40,y*T+37)}if(sel){ctx.fillStyle='#fde047';ctx.font='bold 16px sans-serif';ctx.fillText('▼',x*T+40,y*T+15)}if(x===s.x&&y===s.y){ctx.fillStyle='#fff';ctx.fillRect(x*T+28,y*T+18,24,39);ctx.fillStyle='#111827';ctx.fillRect(x*T+33,y*T+27,4,4);ctx.fillRect(x*T+43,y*T+27,4,4)}}function wrap(t,x,y,w){if(ctx.measureText(t).width<=w){ctx.fillText(t,x,y);return}const m=Math.ceil(t.length/2);ctx.fillText(t.slice(0,m),x,y-6);ctx.fillText(t.slice(m),x,y+7)}function drawStats(){stats.innerHTML=`<div class="stat">Lv ${s.lv}</div><div class="stat">HP ${s.hp}/${s.maxHp}</div><div class="stat">MP ${s.mp}/${s.maxMp}</div><div class="stat">攻 ${s.atk}</div><div class="stat">守 ${s.def}</div><div class="stat">${s.gold}G</div><div class="stat wide">仲間：${s.allies.join('・')}</div><div class="stat">欠片 ${s.fragments}/3</div><div class="stat">笑顔 ${s.smile}</div>`}function drawNotice(){let p=phase(),txt=`新規開拓 ${s.newTiles}マス／総移動 ${s.steps}手　装備：${s.weapon||'なし'}　`;txt+=p===0?`あと${8-s.newTiles}マスで夜になり敵が強化`:p===1?`夜：敵HP+20％・攻撃+1。あと${12-s.newTiles}マスで深夜`: `深夜：敵HP+40％・攻撃+2`;if(s.conference)txt+='／久美の作戦で敵攻撃-2';notice.textContent=txt}function buttons(a){cmd.innerHTML='';a.forEach(i=>{const b=document.createElement('button');b.textContent=i.label;b.disabled=!!i.disabled;b.onclick=i.fn;cmd.appendChild(b)})}function clear(){cmd.innerHTML=''}function enter(x,y){if(s.ended)return;if(!selectable(x,y)){msg.textContent='黄色枠の隣接マスを選ぼう。';return}s.steps++;const k=key(x,y);if(s.opened[k]){s.x=x;s.y=y;clear();save('開いた道を一歩戻った。');draw();return}resolve(map[y][x],x,y)}function complete(x,y,text){const k=key(x,y);s.done[k]=true;s.opened[k]=true;s.x=x;s.y=y;s.newTiles++;clear();save(text);draw()}function rescue(d,x,y){if(d.locked==='wolf'&&!s.wolfDown){msg.textContent='影オオカミが周囲をうろついている。先に倒さないと史帆を救出できない。';return}if(d.cost&&s.gold<d.cost){msg.textContent=`救出には${d.cost}G必要。先に宝箱や敵で資金を集めよう。`;return}buttons([{label:`救出する${d.cost?' '+d.cost+'G':''}`,fn:()=>{if(d.cost)s.gold-=d.cost;if(!s.allies.includes(d.ally))s.allies.push(d.ally);['atk','def','maxHp','hp','mp','smile'].forEach(v=>{if(d[v])s[v]+=d[v]});let bonus=0;if(s.newTiles<=6){bonus=8;s.smile+=8;s.fastRescues++}complete(x,y,`${d.name}を救出！${bonus?' 早期救出ボーナスで笑顔+8。':''}`)}},{label:'今はやめる',fn:clear}])}function resolve(id,x,y){const d=data[id];if(d.type==='road')return complete(x,y,'道が開いた。');if(d.type==='ally')return rescue(d,x,y);if(d.type==='reward'){['gold','atk','def','maxHp','hp','mp','smile'].forEach(v=>{if(d[v])s[v]+=d[v]});return complete(x,y,`${d.name}から力を得た。`)}if(d.type==='conference'){s.conference=true;s.def+=2;s.smile+=10;return complete(x,y,'久美の作戦会議。守備+2、笑顔+10。以後すべての敵の攻撃-2。')}if(d.type==='heal'){s.hp=s.maxHp;s.mp=s.maxMp;return complete(x,y,'一度きりの泉で全回復した。')}if(d.type==='fragment'){s.fragments++;s.smile+=5;return complete(x,y,'光の欠片を入手。笑顔+5。')}if(d.type==='quiz')return quiz(x,y);if(d.type==='shop')return shop(x,y);if(d.type==='inn')return inn(x,y);if(d.type==='shrine')return shrine(x,y);if(d.type==='enemy'||d.type==='boss')return battle(d,x,y)}function quiz(x,y){buttons([{label:'「キュン」',fn:()=>{s.smile+=18;s.mp+=4;complete(x,y,'正解！ 笑顔+18、MP+4。')}},{label:'「絶望の一秒前」',fn:()=>{s.hp=Math.max(1,s.hp-10);complete(x,y,'不正解。HP-10。')}},{label:'戻る',fn:clear}])}function shop(x,y){if(s.weapon){msg.textContent=`すでに${s.weapon}を選んでいる。武器屋は一品限り。`;return complete(x,y,'武器屋を通り抜けた。')}buttons([{label:'光の剣 20G（攻+7）',disabled:s.gold<20,fn:()=>{s.gold-=20;s.atk+=7;s.weapon='光の剣';complete(x,y,'光の剣を選んだ。盾はもう買えない。')}},{label:'光の盾 18G（守+6）',disabled:s.gold<18,fn:()=>{s.gold-=18;s.def+=6;s.weapon='光の盾';complete(x,y,'光の盾を選んだ。剣はもう買えない。')}},{label:'何も買わず通る',fn:()=>complete(x,y,'武器屋を通り抜けた。')}])}function inn(x,y){buttons([{label:'泊まる 10G',disabled:s.gold<10,fn:()=>{s.gold-=10;s.hp=s.maxHp;s.mp=s.maxMp;complete(x,y,'一度きりの宿で全回復した。')}},{label:'泊まらず通る',fn:()=>complete(x,y,'宿屋を温存せず通り抜けた。')}])}function shrine(x,y){if(s.smile<35){msg.textContent='笑顔35以上で祠が開く。先に仲間やクイズを回る必要がある。';return} s.fragments++;s.maxHp+=10;s.hp+=10;s.smile+=8;complete(x,y,'笑顔の祠が開いた。欠片+1、最大HP+10、笑顔+8。')}function battle(base,x,y){const mod=enemyMods(),foe={...base};foe.hp=Math.round(foe.hp*mod.hp);foe.atk=Math.max(1,foe.atk+mod.atk);let guard=false;msg.textContent=`${foe.name}が道を塞ぐ！ HP${foe.hp}／攻撃${foe.atk}`;turn();function turn(){buttons([{label:'たたかう',fn:()=>attack(false)},{label:'ひなた魔法 MP3',disabled:s.mp<3,fn:()=>attack(true)},{label:'ぼうぎょ',fn:()=>{guard=true;enemy()}},{label:'引き返す',disabled:base.type==='boss',fn:()=>{msg.textContent='別の順番を考えることにした。';clear()}}])}function attack(m){let dmg;if(m){s.mp-=3;dmg=Math.max(4,s.atk+8+s.allies.length*2-foe.def+rand(7))}else dmg=Math.max(1,s.atk+s.allies.length-foe.def+rand(6));foe.hp-=dmg;msg.textContent=`${m?'ひなた魔法':'みんなの攻撃'}！ ${dmg}ダメージ。`;if(foe.hp<=0)return win();setTimeout(enemy,260)}function enemy(){let dmg=Math.max(1,foe.atk-s.def+rand(6));if(guard){dmg=Math.ceil(dmg/2);guard=false}s.hp-=dmg;msg.textContent=`${foe.name}の攻撃！ ${dmg}ダメージ。`;if(s.hp<=0){s.hp=1;s.gold=Math.floor(s.gold/2);msg.textContent='敗北。HP1で戻り、所持金半減。敵は残る。';clear();save();draw();return}save();draw();setTimeout(turn,260)}function win(){if(base.type==='boss')return ending(x,y);s.gold+=base.gold||0;s.exp+=base.exp||0;if(base.special==='wolf')s.wolfDown=true;while(s.exp>=18*s.lv){s.exp-=18*s.lv;s.lv++;s.maxHp+=7;s.hp=s.maxHp;s.atk+=2;s.def+=1}complete(x,y,`${base.name}を倒した！${base.special==='wolf'?' 加藤史帆を救出できるようになった。':''}`)}}function ending(x,y){s.opened[key(x,y)]=true;s.done[key(x,y)]=true;s.x=x;s.y=y;s.ended=true;clear();let title='ノーマルエンド「小さな光」';if(s.fragments>=3&&s.smile>=70&&s.allies.length>=4&&s.newTiles<=18&&s.fastRescues>=1)title='ベストエンド「約束のライブ」';else if(s.fragments>=2&&s.allies.length>=3)title='ベターエンド「また会える日まで」';save(`${title}\n欠片${s.fragments}、笑顔${s.smile}、仲間${s.allies.length}人、新規開拓${s.newTiles}マス。`);draw()}function rand(n){return Math.floor(Math.random()*n)}cvs.addEventListener('pointerup',e=>{e.preventDefault();const r=cvs.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*cvs.width/r.width/T),y=Math.floor((e.clientY-r.top)*cvs.height/r.height/T);enter(x,y)});document.getElementById('save').onclick=()=>save('冒険の記録を保存した。');document.getElementById('reset').onclick=()=>{if(confirm('最初から始めますか？')){s=fresh();save();location.reload()}};draw()})();</script></body></html>
