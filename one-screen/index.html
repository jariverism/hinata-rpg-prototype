<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一画面ひなた勇者</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:10px}.wrap{width:min(100%,700px);background:#182230;border:3px solid #e4e7ec;border-radius:14px;padding:10px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}h1{font-size:21px;margin:0}small{color:#98a2b3}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}.stat{background:#0c111d;border:1px solid #475467;border-radius:6px;padding:5px;text-align:center;font-size:12px}.wide{grid-column:span 3}canvas{display:block;width:100%;height:auto;border:3px solid #fff;background:#000;image-rendering:pixelated;touch-action:manipulation}.msg{min-height:94px;background:#05070b;border:3px solid #fff;border-radius:7px;margin-top:8px;padding:10px 12px;white-space:pre-line;line-height:1.55}.cmd{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.cmd button,.util button{border:2px solid #fff;border-radius:7px;background:#111827;color:#fff;font-weight:700;padding:11px}.cmd button:disabled{opacity:.35}.util{display:flex;gap:6px;margin-top:8px}.util button{flex:1}.help{font-size:11px;color:#98a2b3;text-align:center;margin:8px 0 0}@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.wide{grid-column:span 3}}</style></head><body><main><section class="wrap"><header><h1>一画面ひなた勇者</h1><small>隣接マス開拓型 v2.0</small></header><div id="stats" class="stats"></div><canvas id="game" width="560" height="560"></canvas><div id="msg" class="msg">中央から冒険を始めよう。黄色く光る上下左右のマスだけ選べる。</div><div id="cmd" class="cmd"></div><div class="util"><button id="save">セーブ</button><button id="reset">最初から</button></div><p class="help">黄色枠の隣接マスをタップ。攻略すると道になり、その先へ進めます。</p></section></main><script>(()=>{'use strict';const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),msg=document.getElementById('msg'),cmd=document.getElementById('cmd'),stats=document.getElementById('stats');const N=7,T=80,SAVE='one_screen_hinata_v2';const fresh=()=>({x:3,y:3,hp:42,maxHp:42,mp:10,maxMp:10,atk:9,def:5,lv:1,exp:0,gold:20,smile:0,fragments:0,allies:['佐々木久美'],opened:{'3,3':true},done:{},ended:false});let s=load();const map=[['wall','kyo','slime','chest','wolf','mirei','wall'],['heal','enemy1','quiz','shop','enemy2','katoshi','fragment'],['enemy3','road','enemy4','road','enemy5','inn','enemy6'],['chest2','enemy7','road','start','road','enemy8','shrine'],['enemy9','road','enemy10','road','enemy11','road','enemy12'],['fragment2','enemy13','mirei2','enemy14','kumi','enemy15','boss'],['wall','enemy16','chest3','heal2','enemy17','fragment3','wall']];const data={start:{name:'光の広場',type:'road',color:'#fde68a'},road:{name:'草原',type:'road',color:'#65a30d'},wall:{name:'岩山',type:'wall',color:'#334155'},kyo:{name:'齊藤京子',type:'ally',ally:'齊藤京子',color:'#9333ea',atk:3,mp:5,smile:12},katoshi:{name:'加藤史帆',type:'ally',ally:'加藤史帆',color:'#ec4899',def:4,smile:12},mirei:{name:'佐々木美玲',type:'ally',ally:'佐々木美玲',color:'#f59e0b',maxHp:12,hp:12,smile:12},mirei2:{name:'パンの村',type:'reward',color:'#fbbf24',gold:25,smile:8},kumi:{name:'久美の作戦会議',type:'reward',color:'#eab308',def:2,smile:10},heal:{name:'潮の泉',type:'heal',color:'#0ea5e9'},heal2:{name:'癒やしの泉',type:'heal',color:'#38bdf8'},shop:{name:'武器屋',type:'shop',color:'#b45309'},inn:{name:'宿屋',type:'inn',color:'#16a34a'},quiz:{name:'ひなたクイズ',type:'quiz',color:'#f97316'},shrine:{name:'笑顔の祠',type:'shrine',color:'#fde047'},chest:{name:'宝箱',type:'reward',color:'#a16207',gold:20,smile:5},chest2:{name:'宝箱',type:'reward',color:'#a16207',gold:18,mp:3},chest3:{name:'宝箱',type:'reward',color:'#a16207',gold:35,smile:5},fragment:{name:'光の欠片',type:'fragment',color:'#fef08a'},fragment2:{name:'光の欠片',type:'fragment',color:'#fef08a'},fragment3:{name:'光の欠片',type:'fragment',color:'#fef08a'},boss:{name:'魔王',type:'boss',color:'#111827',hp:150,atk:20,def:8}};for(let i=1;i<=17;i++)data['enemy'+i]={name:['ひなたスライム','影オオカミ','黒い番人','月影バット'][i%4],type:'enemy',color:['#22c55e','#64748b','#334155','#7c3aed'][i%4],hp:18+i*4,atk:6+Math.floor(i/2),def:1+Math.floor(i/4),exp:8+i*2,gold:6+i};function load(){try{return JSON.parse(localStorage.getItem(SAVE))||fresh()}catch(e){return fresh()}}function save(t){localStorage.setItem(SAVE,JSON.stringify(s));if(t)msg.textContent=t}function key(x,y){return x+','+y}function adjacent(x,y){return Math.abs(x-s.x)+Math.abs(y-s.y)===1}function canSelect(x,y){if(x<0||y<0||x>=N||y>=N)return false;const k=key(x,y),d=data[map[y][x]];return s.opened[k]||(!s.done[k]&&adjacent(x,y)&&d.type!=='wall')}function draw(){ctx.clearRect(0,0,560,560);for(let y=0;y<N;y++)for(let x=0;x<N;x++)drawTile(x,y);drawStats()}function drawTile(x,y){const id=map[y][x],d=data[id],k=key(x,y),open=!!s.opened[k],available=!open&&canSelect(x,y);ctx.fillStyle=open?'#4d7c0f':available?'#1e293b':'#020617';ctx.fillRect(x*T,y*T,T,T);ctx.strokeStyle=available?'#fde047':'#334155';ctx.lineWidth=available?5:1;ctx.strokeRect(x*T+2,y*T+2,T-4,T-4);if(open){ctx.fillStyle='#d9f99d';ctx.fillRect(x*T+31,y*T+31,18,18)}else if(available){ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(x*T+40,y*T+34,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(d.name,x*T+40,y*T+67)}else{ctx.fillStyle='#475569';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('？',x*T+40,y*T+48)}if(x===s.x&&y===s.y){ctx.fillStyle='#fff';ctx.fillRect(x*T+28,y*T+19,24,38);ctx.fillStyle='#111827';ctx.fillRect(x*T+33,y*T+27,4,4);ctx.fillRect(x*T+43,y*T+27,4,4)}}function drawStats(){stats.innerHTML=`<div class="stat">Lv ${s.lv}</div><div class="stat">HP ${s.hp}/${s.maxHp}</div><div class="stat">MP ${s.mp}/${s.maxMp}</div><div class="stat">攻 ${s.atk}</div><div class="stat">守 ${s.def}</div><div class="stat">${s.gold}G</div><div class="stat wide">仲間：${s.allies.join('・')}</div><div class="stat">欠片 ${s.fragments}/3</div><div class="stat">笑顔 ${s.smile}</div>`}function buttons(a){cmd.innerHTML='';a.forEach(i=>{const b=document.createElement('button');b.textContent=i.label;b.disabled=!!i.disabled;b.onclick=i.fn;cmd.appendChild(b)})}function clear(){cmd.innerHTML=''}function enter(x,y){if(s.ended)return;const k=key(x,y);if(s.opened[k]){s.x=x;s.y=y;msg.textContent='通ったことのある道へ移動した。';save();draw();return}if(!canSelect(x,y)){msg.textContent='今いるマスの上下左右から選ぼう。';return}resolve(map[y][x],x,y)}function complete(x,y,text){const k=key(x,y);s.done[k]=true;s.opened[k]=true;s.x=x;s.y=y;clear();save(text);draw()}function resolve(id,x,y){const d=data[id];if(d.type==='road')return complete(x,y,'道が開いた。');if(d.type==='ally'){s.allies.push(d.ally);['atk','def','maxHp','hp','mp','smile'].forEach(v=>{if(d[v])s[v]+=d[v]});return complete(x,y,`${d.name}を助けた！ 仲間になった。`)}if(d.type==='reward'){['gold','atk','def','maxHp','hp','mp','smile'].forEach(v=>{if(d[v])s[v]+=d[v]});return complete(x,y,`${d.name}を調べ、力を得た。`)}if(d.type==='heal'){s.hp=s.maxHp;s.mp=s.maxMp;return complete(x,y,'潮の祈りで全回復した。')}if(d.type==='fragment'){s.fragments++;s.smile+=5;return complete(x,y,'光の欠片を手に入れた。笑顔+5。')}if(d.type==='quiz')return quiz(x,y);if(d.type==='shop')return shop(x,y);if(d.type==='inn')return inn(x,y);if(d.type==='enemy'||d.type==='boss')return battle(d,x,y)}function quiz(x,y){buttons([{label:'「キュン」',fn:()=>{s.smile+=18;s.mp+=4;complete(x,y,'正解！ 笑顔+18、MP+4。')}},{label:'「絶望の一秒前」',fn:()=>{s.hp=Math.max(1,s.hp-10);complete(x,y,'不正解。HPを10失った。')}},{label:'戻る',fn:clear}])}function shop(x,y){buttons([{label:'光の剣 20G',disabled:s.gold<20,fn:()=>{s.gold-=20;s.atk+=6;complete(x,y,'光の剣を購入。攻撃+6。')}},{label:'光の盾 18G',disabled:s.gold<18,fn:()=>{s.gold-=18;s.def+=5;complete(x,y,'光の盾を購入。守備+5。')}},{label:'何も買わず通る',fn:()=>complete(x,y,'武器屋を通り抜けた。')}])}function inn(x,y){buttons([{label:'泊まる 10G',disabled:s.gold<10,fn:()=>{s.gold-=10;s.hp=s.maxHp;s.mp=s.maxMp;complete(x,y,'宿屋で全回復した。')}},{label:'泊まらず通る',fn:()=>complete(x,y,'宿屋を通り抜けた。')}])}function battle(e,x,y){const foe={...e};let guard=false;msg.textContent=`${foe.name}が道を塞いでいる！`;turn();function turn(){buttons([{label:'たたかう',fn:()=>attack(false)},{label:'ひなた魔法 MP3',disabled:s.mp<3,fn:()=>attack(true)},{label:'ぼうぎょ',fn:()=>{guard=true;enemy()}},{label:'引き返す',disabled:e.type==='boss',fn:()=>{msg.textContent='別の道を探すことにした。';clear()}}])}function attack(m){let dmg;if(m){s.mp-=3;dmg=Math.max(4,s.atk+8+s.allies.length*2-foe.def+rand(7))}else dmg=Math.max(1,s.atk+s.allies.length-foe.def+rand(6));foe.hp-=dmg;msg.textContent=`${m?'ひなた魔法':'みんなの攻撃'}！ ${dmg}ダメージ。`;if(foe.hp<=0)return win();setTimeout(enemy,300)}function enemy(){let dmg=Math.max(1,foe.atk-s.def+rand(6));if(guard){dmg=Math.ceil(dmg/2);guard=false}s.hp-=dmg;msg.textContent=`${foe.name}の攻撃！ ${dmg}ダメージ。`;if(s.hp<=0){s.hp=1;s.gold=Math.floor(s.gold/2);msg.textContent='敗北した。HP1、所持金半減。敵は残っている。';clear();save();draw();return}save();draw();setTimeout(turn,300)}function win(){if(e.type==='boss')return ending(x,y);s.gold+=e.gold||0;s.exp+=e.exp||0;while(s.exp>=18*s.lv){s.exp-=18*s.lv;s.lv++;s.maxHp+=7;s.hp=s.maxHp;s.atk+=2;s.def+=1}complete(x,y,`${e.name}を倒した！ 道が開いた。`)}}function ending(x,y){s.opened[key(x,y)]=true;s.x=x;s.y=y;s.ended=true;clear();let title='ノーマルエンド「小さな光」';if(s.fragments>=3&&s.smile>=70&&s.allies.length>=4)title='ベストエンド「約束のライブ」';else if(s.fragments>=2&&s.allies.length>=3)title='ベターエンド「また会える日まで」';save(`${title}\n欠片${s.fragments}、笑顔${s.smile}、仲間${s.allies.length}人。`);draw()}function rand(n){return Math.floor(Math.random()*n)}cvs.addEventListener('pointerup',e=>{const r=cvs.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*560/r.width/T),y=Math.floor((e.clientY-r.top)*560/r.height/T);enter(x,y)});document.getElementById('save').onclick=()=>save('冒険の記録を保存した。');document.getElementById('reset').onclick=()=>{if(confirm('最初から始めますか？')){s=fresh();save();location.reload()}};draw()})();</script></body></html>
