<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日向坂サクセス LOOP v1.3</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f5f1fb;color:#292333}.wrap{max-width:760px;margin:auto;padding:8px}.card{background:#fff;border:1px solid #e4dcf0;border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:0 8px 22px #3d2c6412}h1,h2,h3,p{margin-top:0}.small{font-size:12px;color:#777}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn,.member,.item,.act{border:1px solid #ddd4ed;background:#fff;border-radius:13px;padding:11px;font:inherit}.btn{font-weight:800}.primary{background:#6855d9;color:#fff;border:0}.member{text-align:left}.member.on,.item.on{border:2px solid #6855d9;background:#f7f4ff}.item{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;text-align:left;margin-bottom:7px}.ico{width:38px;height:38px;border-radius:11px;background:#f0eafb;display:grid;place-items:center;font-size:20px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0ebfb;font-size:11px;margin:2px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;position:sticky;top:0;background:#f5f1fbe8;padding:6px 0;z-index:2}.tab{border:0;border-radius:10px;padding:10px;background:#eee8f7;font-weight:800}.tab.on{background:#6855d9;color:#fff}.stat{display:grid;grid-template-columns:65px 1fr 34px;gap:7px;align-items:center;margin:7px 0;font-size:13px}.bar{height:9px;background:#eee9f4;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6855d9,#ef7cb4)}.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.act{text-align:left;min-height:90px}.locked{opacity:.45}.log{max-height:240px;overflow:auto}.log div{border-left:4px solid #6855d9;padding:7px;background:#faf8ff;border-radius:8px;margin-bottom:6px;font-size:12px}.notice{background:#fff4ce;border:1px solid #efd885;border-radius:12px;padding:10px;margin-bottom:10px}.final{background:linear-gradient(135deg,#32245f,#6b54d9);color:#fff}.final .small{color:#eee}.big{font-size:44px;font-weight:900}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div id="app" class="wrap"></div><script>(function(){'use strict';const $=id=>document.getElementById(id),cl=n=>Math.max(0,Math.min(100,n)),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const MEM=[['井口眞緒','井','トーク型',[17,31,27,57,36,49],'ig'],['潮紗理菜','潮','安定型',[18,40,39,42,43,57],'ush'],['柿崎芽実','柿','表現型',[20,43,45,38,58,45],'mem'],['加藤史帆','加','万能型',[21,49,48,46,55,47],'kat'],['齊藤京子','齊','歌唱型',[23,64,37,44,52,53],'kyo'],['佐々木久美','久','統率型',[18,39,43,52,44,61],'kum'],['佐々木美玲','美','ライブ型',[20,54,53,46,49,57],'mir'],['高瀬愛奈','高','知性型',[16,40,39,44,42,56],'tak'],['高本彩花','彩','モデル型',[19,38,46,41,59,49],'aya'],['東村芽依','東','身体型',[18,37,61,31,51,52],'mei']];const N=['人気','歌唱','ダンス','トーク','表現力','メンタル'];const ITEMS={kat:{n:'負けず嫌いのノート',i:'📓',d:'ライブ大成功率+12%。久美装備時に審査+7'},kum:{n:'キャプテンのメモ帳',i:'🗒️',d:'運営評価+10。加藤装備時に審査+7'},kyo:{n:'歌姫のマイク',i:'🎤',d:'歌唱練習+2'},mir:{n:'太陽のペンライト',i:'☀️',d:'月末ライブ+10'},mei:{n:'俊足シューズ',i:'👟',d:'ダンス成功率+12%'},aya:{n:'ランウェイの鏡',i:'🪞',d:'表現力練習+2'},ush:{n:'幸運のクローバー',i:'🍀',d:'失敗を25%で成功に変える'},tak:{n:'分析ノート',i:'📘',d:'審査評価+5'},ig:{n:'バラエティ笛',i:'📣',d:'トーク時に人気+3'},mem:{n:'約束のリボン',i:'🎀',d:'最終評価+15'}};function safeMeta(){let x;try{x=JSON.parse(localStorage.getItem('hinata_loop_meta')||'{}')}catch(e){x={}}return{runs:Number(x.runs)||0,owned:Array.isArray(x.owned)?x.owned.filter(id=>ITEMS[id]):[],clears:x.clears&&typeof x.clears==='object'?x.clears:{},centers:Number(x.centers)||0,worlds:Array.isArray(x.worlds)?x.worlds:[],equipped:Array.isArray(x.equipped)?x.equipped.filter(id=>ITEMS[id]).slice(0,2):[]}}function safeRun(){try{let x=JSON.parse(localStorage.getItem('hinata_loop_run')||'null');if(!x||!Array.isArray(x.st)||!x.m)return null;x.week=Number(x.week)||1;x.energy=Number(x.energy)||0;x.staff=Number(x.staff)||0;x.judges=Number(x.judges)||0;x.logs=Array.isArray(x.logs)?x.logs:[];return x}catch(e){return null}}let meta=safeMeta(),sel=3,screen='home',game=safeRun(),endingData=null;function saveMeta(){try{localStorage.setItem('hinata_loop_meta',JSON.stringify(meta))}catch(e){}}function saveRun(){try{if(game)localStorage.setItem('hinata_loop_run',JSON.stringify(game));else localStorage.removeItem('hinata_loop_run')}catch(e){}}function nav(){return '<div class="tabs">'+[['home','出発'],['book','遺物図鑑'],['play','育成']].map(x=>'<button class="tab '+(screen===x[0]?'on':'')+'" data-screen="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'}function item(id){let o=ITEMS[id],on=meta.equipped.includes(id);return '<button class="item '+(on?'on':'')+'" data-item="'+id+'"><span class="ico">'+o.i+'</span><span><b>'+o.n+(on?'［装備中］':'')+'</b><div class="small">'+o.d+'</div></span><span>'+(on?'解除':'装備')+'</span></button>'}function home(){return '<div class="card"><div class="small">HINATA SUCCESS LOOP v1.3</div><h1>世界線を紡ぐ育成RPG</h1><span class="pill">周回 '+meta.runs+'</span><span class="pill">獲得遺物 '+meta.owned.length+'</span><span class="pill">センター '+meta.centers+'</span></div><div class="card"><h3>主人公</h3><div class="grid">'+MEM.map((m,i)=>'<button class="member '+(i===sel?'on':'')+'" data-m="'+i+'"><b>'+m[0]+'</b><div class="small">'+m[2]+'／最高 '+(meta.clears[m[6]]||'未完走')+'</div></button>').join('')+'</div></div><div class="card"><h3>装備中（'+meta.equipped.length+'/2）</h3>'+(meta.equipped.length?meta.equipped.map(item).join(''):'<div class="notice">装備なし。下の所持遺物をタップすると装備できる。</div>')+'<h3>所持遺物</h3>'+(meta.owned.length?meta.owned.map(item).join(''):'<p class="small">まだ遺物がない。誰かで完走すると、そのメンバーの遺物を獲得する。</p>')+'<div class="row"><button class="btn primary" id="start">この装備で育成開始</button>'+(game?'<button class="btn" id="continue">途中から</button>':'')+'</div></div>'}function book(){return '<div class="card"><h2>遺物図鑑</h2>'+Object.keys(ITEMS).map(id=>meta.owned.includes(id)?item(id):'<div class="item locked"><span class="ico">？</span><span><b>未発見</b><div class="small">対応メンバーで完走すると発見</div></span><span>---</span></div>').join('')+'</div>'}function score(){return Math.round(game.st.reduce((a,b)=>a+b,0)/6*.75+game.staff*.2+game.judges*3+(meta.equipped.includes('mem')?15:0))}function play(){if(endingData)return finalView();let m=game.m;return '<div class="card"><h2>'+m[0]+'　育成中</h2><div class="small">第'+game.week+'週／104週　装備 '+(meta.equipped.map(id=>ITEMS[id].n).join('・')||'なし')+'</div>'+(game.week===104?'<div class="notice"><b>最終週</b><br>この行動後、最終センター発表へ進む。</div>':'')+game.st.map((v,i)=>'<div class="stat"><span>'+N[i]+'</span><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><b>'+v+'</b></div>').join('')+'<div class="stat"><span>体力</span><div class="bar"><div class="fill" style="width:'+game.energy+'%"></div></div><b>'+game.energy+'</b></div><div class="stat"><span>運営</span><div class="bar"><div class="fill" style="width:'+game.staff+'%"></div></div><b>'+game.staff+'</b></div><p><b>センター評価 '+score()+'</b></p></div><div class="card"><div class="acts" id="acts"></div></div><div class="card"><h3>活動記録</h3><div class="log">'+(game.logs.map(x=>'<div>第'+x.w+'週 '+x.t+'</div>').join('')||'<div>新しい世界線が始まった。</div>')+'</div></div>'}function finalView(){let e=endingData;return '<div class="card final"><div class="small">WORLD LINE COMPLETE</div><div class="big">'+e.rk+'</div><h1>'+e.title+'</h1><p>最終評価 '+e.sc+'／選抜審査突破 '+e.judges+'/4</p></div><div class="card"><h3>周回報酬</h3><p>遺物「<b>'+e.item+'</b>」を記憶に持ち帰った。</p><p class="small">この遺物は別メンバーの世界線でも装備できる。</p><button class="btn primary" id="nextWorld">次の世界線へ</button></div>'}function render(){let app=$('app');if(screen==='play'&&game&&!endingData&&game.week>104){finish();return}app.innerHTML=nav()+(screen==='home'?home():screen==='book'?book():play());bind()}function bind(){document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{if(b.dataset.screen==='play'&&!game)return;screen=b.dataset.screen;render()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sel=Number(b.dataset.m);render()});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>equip(b.dataset.item));let s=$('start');if(s)s.onclick=start;let c=$('continue');if(c)c.onclick=()=>{screen='play';render()};let n=$('nextWorld');if(n)n.onclick=()=>{endingData=null;game=null;saveRun();screen='home';render()};if(screen==='play'&&game&&!endingData)actions()}function equip(id){if(!meta.owned.includes(id))return;let i=meta.equipped.indexOf(id);if(i>=0)meta.equipped.splice(i,1);else{if(meta.equipped.length>=2)meta.equipped.shift();meta.equipped.push(id)}saveMeta();render()}function start(){let m=MEM[sel];game={m:m,week:1,st:m[3].slice(),energy:100,staff:18+(meta.equipped.includes('kum')?10:0),judges:0,logs:[]};endingData=null;screen='play';saveRun();render()}function actions(){let A=[['ボイトレ',1],['ダンス',2],['バラエティ',3],['モデル撮影',4],['仲間と語る',5],['休養',-1]];$('acts').innerHTML=A.map((a,i)=>'<button class="act" data-a="'+i+'"><b>'+a[0]+'</b><div class="small">'+(a[1]<0?'体力+30':'能力上昇・体力-9')+'</div></button>').join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(A[Number(b.dataset.a)]))}function act(a){if(a[1]<0){game.energy=cl(game.energy+30);log('休養して体力を回復');return advance()}game.energy=cl(game.energy-9);let chance=76+(a[1]===2&&meta.equipped.includes('mei')?12:0),ok=rnd(1,100)<=chance;if(!ok&&meta.equipped.includes('ush')&&rnd(1,100)<=25)ok=true;if(ok){let up=rnd(2,4);if(a[1]===1&&meta.equipped.includes('kyo'))up+=2;if(a[1]===4&&meta.equipped.includes('aya'))up+=2;game.st[a[1]]=cl(game.st[a[1]]+up);game.staff=cl(game.staff+1);if(a[1]===3&&meta.equipped.includes('ig'))game.st[0]=cl(game.st[0]+3);log(a[0]+'成功 '+N[a[1]]+'+'+up)}else{game.st[5]=cl(game.st[5]-3);log(a[0]+'失敗')}advance()}function advance(){let current=game.week;if([24,48,72,96].includes(current)){let bonus=(meta.equipped.includes('tak')?5:0)+(((game.m[6]==='kum'&&meta.equipped.includes('kat'))||(game.m[6]==='kat'&&meta.equipped.includes('kum')))?7:0),need={24:55,48:64,72:73,96:82}[current];if(score()+bonus>=need){game.judges++;log('選抜審査突破')}else log('選抜審査不合格')}if(current>=104){saveRun();return finish()}game.week=current+1;saveRun();render()}function finish(){if(!game||endingData)return;let sc=score(),rk=sc>=90?'S':sc>=78?'A':sc>=66?'B':sc>=54?'C':'D',title=rk==='S'?'デビュー曲センター':rk==='A'?'フロントメンバー':rk==='B'?'二列目選抜':rk==='C'?'三列目選抜':'選抜入りならず',id=game.m[6];if(!meta.owned.includes(id))meta.owned.push(id);meta.runs++;if(rk==='S')meta.centers++;let order='DCBAS',old=meta.clears[id];if(!old||order.indexOf(rk)>order.indexOf(old))meta.clears[id]=rk;meta.worlds.push({member:game.m[0],rank:rk,score:sc});saveMeta();endingData={sc:sc,rk:rk,title:title,item:ITEMS[id].n,judges:game.judges};localStorage.removeItem('hinata_loop_run');screen='play';render()}function log(t){game.logs.unshift({w:game.week,t:t});if(game.logs.length>50)game.logs.pop()}window.addEventListener('error',function(e){let a=$('app');if(a&&!a.innerHTML)a.innerHTML='<div class="card"><h2>復旧モード</h2><p>画面の読み込みに失敗しました。</p><button class="btn" onclick="localStorage.removeItem(\'hinata_loop_run\');location.reload()">途中データを消して復旧</button></div>'});saveMeta();render()})();</script></body></html>
