<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日向坂サクセス LOOP</title><style>
:root{--m:#6855d9;--p:#ef7cb4;--bg:#f6f2fb;--ink:#282334;--line:#e4dcf1;--gold:#b98b16}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f2eeff,#fff7fb);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink)}button{font:inherit}.wrap{max-width:760px;margin:auto;padding:8px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:0 8px 22px #3d2c6412}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.small{font-size:12px;color:#777080}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0ebfb;font-size:11px;margin:2px}.btn,.member,.item,.act,.choice{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px}.btn{font-weight:800}.primary{background:var(--m);color:#fff;border:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:sticky;top:0;z-index:5;background:#f6f2fbe8;backdrop-filter:blur(8px);padding:6px 0}.tab{border:0;border-radius:10px;padding:9px 3px;background:#eee8f7;font-weight:800;font-size:12px}.tab.on{background:var(--m);color:#fff}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.member{text-align:left}.member.on,.item.on{border:2px solid var(--m);background:#f8f5ff}.locked{opacity:.45}.hero{display:flex;gap:12px;align-items:center}.avatar{width:82px;height:102px;border-radius:21px;background:linear-gradient(135deg,var(--m),var(--p));color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900}.speech{border:2px solid #e2d8f4;border-radius:15px;padding:11px;margin-top:10px;font-weight:700}.stat{display:grid;grid-template-columns:64px 1fr 32px;gap:6px;align-items:center;margin:7px 0;font-size:13px}.bar{height:9px;background:#eee9f4;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--m),var(--p))}.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.act{text-align:left;min-height:112px}.act b{display:block}.inv{display:grid;gap:7px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;text-align:left}.ico{width:38px;height:38px;border-radius:11px;background:#f0eafb;display:grid;place-items:center;font-size:20px}.rare{color:var(--gold);font-weight:900}.log{max-height:260px;overflow:auto;display:grid;gap:6px}.log div{border-left:4px solid var(--m);padding:7px;background:#faf8ff;border-radius:8px;font-size:12px}.overlay{position:fixed;inset:0;background:#20162ea0;display:none;place-items:center;padding:12px;z-index:20}.modal{width:100%;max-width:520px;background:#fff;border-radius:20px;padding:17px}.choices{display:grid;gap:7px;margin-top:12px}.choice{text-align:left}.rank{font-size:38px;font-weight:1000;color:var(--m)}h1,h2,h3,p{margin-top:0}@media(max-width:420px){.card{padding:11px}.act{min-height:120px}.tabs{grid-template-columns:repeat(4,1fr)}} </style></head><body><div id="app" class="wrap"></div><div id="ov" class="overlay"><div class="modal"><div id="tag" class="small"></div><h2 id="mt"></h2><div id="mb"></div><div id="choices" class="choices"></div></div></div><script>
const $=x=>document.getElementById(x),cl=x=>Math.max(0,Math.min(100,x)),rr=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[Math.floor(Math.random()*a.length)];
const MEM=[["井口眞緒","井","トーク型",[17,31,27,57,36,49],"ig"],["潮紗理菜","潮","安定型",[18,40,39,42,43,57],"ush"],["柿崎芽実","柿","表現型",[20,43,45,38,58,45],"mem"],["加藤史帆","加","万能型",[21,49,48,46,55,47],"kat"],["齊藤京子","齊","歌唱型",[23,64,37,44,52,53],"kyo"],["佐々木久美","久","統率型",[18,39,43,52,44,61],"kum"],["佐々木美玲","美","ライブ型",[20,54,53,46,49,57],"mir"],["高瀬愛奈","高","知性型",[16,40,39,44,42,56],"tak"],["高本彩花","彩","モデル型",[19,38,46,41,59,49],"aya"],["東村芽依","東","身体型",[18,37,61,31,51,52],"mei"]];
const N=["人気","歌唱","ダンス","トーク","表現力","メンタル"];
const ITEMS={kat:{n:"負けず嫌いのノート",i:"📓",r:1,d:"ライブ大成功率+12%、久美装備時に『支える覚悟』発生",fx:{great:12},owner:"加藤史帆"},kum:{n:"キャプテンのメモ帳",i:"🗒️",r:1,d:"運営評価+10、加藤装備時に友情審査ボーナス",fx:{staff:10},owner:"佐々木久美"},kyo:{n:"歌姫のマイク",i:"🎤",r:2,d:"歌唱練習+2、歌唱審査+8",fx:{train:1,judge:8},owner:"齊藤京子"},mir:{n:"太陽のペンライト",i:"☀️",r:2,d:"月末ライブ評価+10",fx:{live:10},owner:"佐々木美玲"},mei:{n:"俊足シューズ",i:"👟",r:1,d:"ダンス成功率+12%、体力消費-1",fx:{dance:12,cost:1},owner:"東村芽依"},aya:{n:"ランウェイの鏡",i:"🪞",r:1,d:"表現力仕事+2、モデル審査+8",fx:{visual:2,judge:8},owner:"高本彩花"},ush:{n:"幸運のクローバー",i:"🍀",r:2,d:"失敗時25%で成功に変える",fx:{retry:25},owner:"潮紗理菜"},tak:{n:"分析ノート",i:"📘",r:1,d:"審査予告を表示、審査評価+5",fx:{judge:5},owner:"高瀬愛奈"},ig:{n:"バラエティ笛",i:"📣",r:1,d:"トーク仕事の人気上昇+3",fx:{talk:3},owner:"井口眞緒"},mem:{n:"約束のリボン",i:"🎀",r:3,d:"最終審査でメンタル+15相当",fx:{final:15},owner:"柿崎芽実"},photo:{n:"ひらがな結成写真",i:"📷",r:3,d:"全能力+3で開始。全員B以上で発見",fx:{all:3},owner:"共通"},silver:{n:"銀色の紙吹雪",i:"✨",r:4,d:"最終評価+18。センター3回で発見",fx:{final:18},owner:"共通"}};
let meta=JSON.parse(localStorage.getItem("hinata_loop_meta")||'{"runs":0,"owned":[],"clears":{},"centers":0,"worlds":[],"equipped":[]}'),game=null,screen="home",sel=3;
function saveM(){localStorage.setItem("hinata_loop_meta",JSON.stringify(meta))}function saveG(){if(game)localStorage.setItem("hinata_loop_run",JSON.stringify(game))}
function fx(k){return meta.equipped.reduce((a,id)=>a+(ITEMS[id]?.fx?.[k]||0),0)}
function synergy(id){let e=meta.equipped;return(id==="kum"&&e.includes("kat"))||(id==="kat"&&e.includes("kum"))}
function nav(){return `<div class="tabs">${[["home","出発"],["collection","図鑑"],["worlds","世界線"],["play","育成"]].map(x=>`<button class="tab ${screen===x[0]?"on":""}" onclick="goScreen('${x[0]}')">${x[1]}</button>`).join("")}</div>`}
function goScreen(x){if(x==="play"&&!game)x="home";screen=x;render()}
function render(){let a=$("app");a.innerHTML=nav()+(screen==="home"?home():screen==="collection"?collection():screen==="worlds"?worlds():play());bind()}
function home(){let owned=meta.owned.length;return `<div class="card"><div class="small">HINATA SUCCESS LOOP</div><h1>世界線を紡ぐ育成RPG</h1><p>一周ではセンターに届かない。別メンバーで遺物を見つけ、装備して高難度審査を突破する。</p><span class="pill">周回 ${meta.runs}</span><span class="pill">遺物 ${owned}/${Object.keys(ITEMS).length}</span><span class="pill">センター ${meta.centers}</span></div><div class="card"><h3>主人公</h3><div class="grid2">${MEM.map((m,i)=>`<button class="member ${i===sel?"on":""}" data-m="${i}"><b>${m[0]}</b><div class="small">${m[2]}／最高 ${meta.clears[m[6]]||"未完走"}</div></button>`).join("")}</div></div><div class="card"><div class="top"><h3>装備（2枠）</h3><button class="btn" onclick="goScreen('collection')">変更</button></div>${meta.equipped.length?meta.equipped.map(id=>itemHTML(id,true)).join(""):'<p class="small">遺物を入手すると装備できる。</p>'}<button class="btn primary" id="start">この世界線を開始</button>${localStorage.getItem("hinata_loop_run")?'<button class="btn" id="continue">途中から</button>':""}</div>`}
function itemHTML(id){let o=ITEMS[id],on=meta.equipped.includes(id);return `<button class="item ${on?"on":""}" data-item="${id}"><span class="ico">${o.i}</span><span><b>${o.n}</b><div class="small">${o.owner}｜${o.d}</div></span><span class="rare">${"★".repeat(o.r)}</span></button>`}
function collection(){return `<div class="card"><h2>遺物図鑑</h2><p class="small">所持品をタップして装備。最大2個。異なるメンバーの遺物に隠し相互作用がある。</p><div class="inv">${Object.keys(ITEMS).map(id=>meta.owned.includes(id)?itemHTML(id):`<div class="item locked"><span class="ico">？</span><span><b>未発見</b><div class="small">${ITEMS[id].owner}に関係する条件</div></span><span>---</span></div>`).join("")}</div></div>`}
function worlds(){return `<div class="card"><h2>世界線記録</h2>${meta.worlds.length?meta.worlds.slice().reverse().map((w,i)=>`<div class="item"><span class="ico">${w.rank==="S"?"👑":"🎞️"}</span><span><b>${w.member}／${w.rank}</b><div class="small">${w.ending}｜評価${w.score}｜装備 ${w.eq||"なし"}</div></span><span>#${meta.worlds.length-i}</span></div>`).join(""):'<p>まだ世界線は記録されていない。</p>'}</div>`}
function start(){let m=MEM[sel],st=[...m[3]];for(let i=0;i<6;i++)st[i]=cl(st[i]+fx("all"));game={mi:sel,m,week:1,st,energy:100,staff:18+fx("staff"),fans:0,bond:10,cond:"普通",logs:[],judges:0,ended:false};saveG();screen="play";render()}
function cal(){let z=game.week-1;return{y:2016+Math.floor(z/48),mo:Math.floor((z%48)/4)+1,w:z%4+1}}
function centerScore(){let s=game.st;return Math.round(s[0]*.18+s[1]*.17+s[2]*.17+s[3]*.12+s[4]*.15+s[5]*.11+game.staff*.1+game.judges*4+fx("final"))}
function rank(v){return v>=92?"S":v>=80?"A":v>=68?"B":v>=56?"C":"D"}
function play(){let c=cal(),sc=centerScore();return `<div class="card"><div class="top"><div><div class="small">高難度・けやき坂創設編</div><h2>センター選抜への道</h2></div><button class="btn" id="quit">中断</button></div><div class="hero"><div class="avatar">${game.m[1]}</div><div><h2>${game.m[0]}</h2><div>${game.m[2]}／調子 ${game.cond}</div><div class="small">装備：${meta.equipped.map(x=>ITEMS[x].n).join("・")||"なし"}</div></div></div><div class="speech">${synergy(game.m[6])?(game.m[6]==="kum"?"加藤のノートに書かれた努力を、私はグループの力に変える。":"久美のメモが、迷った時に進む方向を示してくれる。"):"この一周で得たものは、次の世界線にも残る。"}</div>${game.st.map((v,i)=>stat(N[i],v)).join("")}${stat("体力",game.energy)}${stat("運営",game.staff)}${stat("絆",game.bond)}</div><div class="card"><div class="top"><div><b>${c.y}年${c.mo}月 第${c.w}週</b><div class="small">${judgeHint()}</div></div><div><span class="rank">${rank(sc)}</span><div class="small">評価 ${sc}</div></div></div><div class="acts" id="acts"></div></div><div class="card"><h3>活動記録</h3><div class="log">${game.logs.map(x=>`<div>第${x.w}週　${x.t}</div>`).join("")||"<div>新しい世界線が始まった。</div>"}</div></div>`}
function stat(n,v){return `<div class="stat"><span>${n}</span><div class="bar"><div class="fill" style="width:${v}%"></div></div><b>${v}</b></div>`}
function judgeHint(){let j=[24,48,72,96].find(x=>x>=game.week);if(!j)return"最終センター発表が近い";return fx("judge")?`分析ノート：第${j}週の審査は総合力と運営評価を重視`:`次の選抜審査まで ${j-game.week}週`}
function bind(){document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{sel=+b.dataset.m;render()});document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>equip(b.dataset.item));$("start")&&($("start").onclick=start);$("continue")&&($("continue").onclick=()=>{game=JSON.parse(localStorage.getItem("hinata_loop_run"));screen="play";render()});$("quit")&&($("quit").onclick=()=>goScreen("home"));if(screen==="play")actions()}
function equip(id){if(!meta.owned.includes(id))return;let i=meta.equipped.indexOf(id);if(i>=0)meta.equipped.splice(i,1);else{if(meta.equipped.length>=2)meta.equipped.shift();meta.equipped.push(id)}saveM();render()}
function actions(){let A=[["ボイトレ",1,9],["ダンス",2,9],["バラエティ",3,10],["モデル撮影",4,9],["仲間と語る",5,8],["休養",-1,-27]];$("acts").innerHTML=A.map((a,i)=>`<button class="act" data-a="${i}"><b>${a[0]}</b><div class="small">${a[1]<0?"必ず成功・体力回復":`成功率 ${chance(a)}%／体力-${Math.max(1,a[2]-fx("cost"))}`}</div></button>`).join("");document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(A[+b.dataset.a]))}
function chance(a){let z=76+(game.cond==="好調"?9:game.cond==="不調"?-13:0)-(game.energy<30?20:0);if(a[1]===2)z+=fx("dance");return cl(z)}
function act(a){if(a[1]<0){game.energy=cl(game.energy+27);game.cond=pick(["普通","普通","好調"]);lg("休養して体力を回復した");return advance()}let cost=Math.max(1,a[2]-fx("cost"));game.energy=cl(game.energy-cost);let ok=rr(1,100)<=chance(a);if(!ok&&rr(1,100)<=fx("retry")){ok=true;lg("クローバーが失敗を成功に変えた")}if(ok){let c=cal(),great=rr(1,100)<=8+fx("great")+(c.mo===8?15:0),up=great?rr(4,6):rr(2,3);if(a[1]===1)up+=fx("train");if(a[1]===4)up+=fx("visual");game.st[a[1]]=cl(game.st[a[1]]+up);game.staff=cl(game.staff+1);game.bond=cl(game.bond+(a[1]===5?4:1));if(a[1]===3)game.st[0]=cl(game.st[0]+1+fx("talk"));lg(`${great?"大成功！":""}${a[0]}で${N[a[1]]}+${up}`)}else{game.st[5]=cl(game.st[5]-3);lg(`${a[0]}失敗。メンタル-3`)}advance()}
function advance(){if([24,48,72,96].includes(game.week))return judge();let c=cal();if(c.w===4)return live();game.week++;if(game.week>104)return ending();if(rr(1,100)<=12)game.cond=pick(["好調","普通","普通","不調"]);saveG();render()}
function live(){let sc=Math.round((game.st[1]+game.st[2]+game.st[4]+game.st[5])/4)+fx("live")+rr(-10,8),ok=sc>=60;if(ok){game.st[0]=cl(game.st[0]+3);game.staff=cl(game.staff+2);game.fans+=sc*40;lg(`月末ライブ成功（${sc}） 人気+3`)}else{game.st[5]=cl(game.st[5]-4);lg(`月末ライブ苦戦（${sc}） メンタル-4`)}game.week++;saveG();modal("MONTHLY LIVE",ok?"会場を沸かせた":"壁にぶつかった",`評価 <b>${sc}</b>。次の審査に向けて育成方針を組み直す。`,[["次の月へ",()=>{closeM();render()}]])}
function judge(){let need=game.week===24?57:game.week===48?66:game.week===72?75:84,sc=centerScore()+fx("judge")+(synergy(game.m[6])?7:0),ok=sc>=need;if(ok){game.judges++;game.staff=cl(game.staff+5);lg(`第${game.judges}回選抜審査を突破（${sc}/${need}）`)}else{game.st[5]=cl(game.st[5]-7);lg(`選抜審査不合格（${sc}/${need}）`)}game.week++;saveG();modal("SELECTION",ok?"選抜審査 突破":"選抜審査 不合格",`要求評価 <b>${need}</b>／今回 <b>${sc}</b><br>${ok?"次の審査はさらに厳しくなる。":"完走はできるが、センターへの道は遠のいた。"}` ,[["進む",()=>{closeM();render()}]])}
function ending(){let sc=centerScore(),rk=rank(sc),end=rk==="S"?"デビュー曲センター":rk==="A"?"フロントメンバー":rk==="B"?"二列目選抜":rk==="C"?"三列目選抜":"選抜入りならず";let id=game.m[6],rewards=[];if(!meta.owned.includes(id)){meta.owned.push(id);rewards.push(ITEMS[id].n)}if(rk==="S")meta.centers++;meta.clears[id]=best(meta.clears[id],rk);if(Object.keys(meta.clears).length>=10&&Object.values(meta.clears).every(x=>"SAB".includes(x))&&!meta.owned.includes("photo")){meta.owned.push("photo");rewards.push(ITEMS.photo.n)}if(meta.centers>=3&&!meta.owned.includes("silver")){meta.owned.push("silver");rewards.push(ITEMS.silver.n)}meta.runs++;meta.worlds.push({member:game.m[0],rank:rk,ending:end,score:sc,eq:meta.equipped.map(x=>ITEMS[x].n).join("・")});saveM();localStorage.removeItem("hinata_loop_run");game.ended=true;modal("WORLD LINE COMPLETE",`${rk}ランク：${end}`,`最終評価 <b>${sc}</b><br>選抜審査突破 ${game.judges}/4<br><br>${rewards.length?`新しい遺物を発見：<b>${rewards.join("、")}</b>`:"既発見の遺物が記憶に刻まれた。"}<br><br>この遺物は別メンバーの周回にも装備できる。`,[["次の世界線へ",()=>{game=null;screen="home";closeM();render()}]])}
function best(a,b){let o="DCBAS";return !a||o.indexOf(b)>o.indexOf(a)?b:a}function lg(t){game.logs.unshift({w:game.week,t});if(game.logs.length>60)game.logs.pop()}function modal(tag,t,b,cs){$("tag").textContent=tag;$("mt").textContent=t;$("mb").innerHTML=b;$("choices").innerHTML=cs.map((c,i)=>`<button class="choice" data-c="${i}">${c[0]}</button>`).join("");document.querySelectorAll("[data-c]").forEach((x,i)=>x.onclick=cs[i][1]);$("ov").style.display="grid"}function closeM(){$("ov").style.display="none"}render();
</script></body></html>
