<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日向坂サクセス v0.4</title><style>:root{--m:#6956d9;--p:#ef87b7;--bg:#f6f3fb;--line:#e5def0;--good:#16815c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:linear-gradient(135deg,#f5f2ff,#fff7fb);color:#262131}.wrap{max-width:760px;margin:auto;padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 24px #49356b14;margin-bottom:10px}h1,h2,h3,p{margin-top:0}.small{font-size:12px;color:#756f81}.members,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.member,.action,.choice,.btn{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;font:inherit}.member.sel{border:2px solid var(--m);background:#f8f5ff}.btn{font-weight:800}.primary{background:var(--m);color:#fff;border:0}.hero{display:flex;gap:12px;align-items:center}.avatar{width:88px;height:110px;border-radius:22px;background:linear-gradient(135deg,var(--m),var(--p));color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900}.speech{position:relative;border:2px solid #e3daf5;border-radius:16px;padding:12px;margin-top:12px;font-weight:700}.stat{display:grid;grid-template-columns:72px 1fr 34px;gap:7px;align-items:center;margin:8px 0;font-size:13px}.bar{height:9px;background:#eee9f4;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--m),var(--p))}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.date{font-weight:900;font-size:20px}.action{text-align:left;min-height:118px}.action b{display:block;margin-bottom:5px}.chance{font-size:11px;color:var(--good)}.log{display:grid;gap:7px;max-height:330px;overflow:auto}.log div{border-left:4px solid var(--m);background:#faf8ff;padding:8px;border-radius:9px;font-size:13px}.overlay{position:fixed;inset:0;background:#241b3899;display:none;place-items:center;padding:14px;z-index:10}.modal{background:#fff;border-radius:20px;padding:18px;max-width:540px;width:100%}.choices{display:grid;gap:8px;margin-top:12px}.choice{text-align:left}@media(max-width:420px){.wrap{padding:7px}.card{padding:11px}.action{min-height:126px}.avatar{width:80px;height:102px}}</style></head><body><div id="start" class="wrap"><div class="card"><div class="small">SCENARIO SELECT</div><h1>日向坂サクセス v0.4</h1><div class="card"><b>2016年 けやき坂創設編</b><p class="small">一期生として2年間を駆け抜ける。8月は夏合宿、毎月末はライブ。</p></div><h3>主人公を選択</h3><div id="members" class="members"></div><p><button id="startBtn" class="btn primary">このメンバーで開始</button> <button id="continueBtn" class="btn">続きから</button></p></div></div><div id="game" class="wrap" style="display:none"><div class="card"><div class="top"><div><div class="small">2016年 けやき坂創設編</div><h2>無名から始まる物語</h2></div><button id="reset" class="btn">最初から</button></div></div><div class="card"><div class="hero"><div id="avatar" class="avatar"></div><div><h2 id="name"></h2><div id="type" class="small"></div><div id="cond" class="small"></div></div></div><div id="speech" class="speech"></div><div id="stats"></div><div class="stat"><span>体力</span><div class="bar"><div id="energyBar" class="fill"></div></div><b id="energy"></b></div><div class="stat"><span>運営評価</span><div class="bar"><div id="staffBar" class="fill"></div></div><b id="staff"></b></div><div class="stat"><span>グループ</span><div class="bar"><div id="groupBar" class="fill"></div></div><b id="group"></b></div></div><div class="card"><div class="top"><div><div id="date" class="date"></div><div id="notice" class="small"></div></div><b id="overall"></b></div><div id="actions" class="actions"></div></div><div class="card"><h3>活動記録</h3><div id="log" class="log"></div></div></div><div id="overlay" class="overlay"><div class="modal"><div id="tag" class="small"></div><h2 id="mt"></h2><div id="mb"></div><div id="choices" class="choices"></div></div></div><script>const M=[["井口眞緒","井","トーク型",[18,34,28,55,38,54]],["潮紗理菜","潮","安定型",[20,43,41,44,45,62]],["柿崎芽実","柿","表現型",[24,45,47,40,60,48]],["加藤史帆","加","万能型",[25,52,50,48,58,50]],["齊藤京子","齊","歌唱型",[28,68,40,47,55,57]],["佐々木久美","久","統率型",[21,42,46,55,47,65]],["佐々木美玲","美","ライブ型",[23,57,56,49,52,61]],["高瀬愛奈","高","知性型",[18,43,42,46,44,60]],["高本彩花","彩","モデル型",[22,40,48,43,61,52]],["東村芽依","東","身体能力型",[21,39,62,33,54,55]]],K=["人気","歌唱","ダンス","トーク","表現力","メンタル"];let sel=0,s=null;const $=x=>document.getElementById(x),cl=x=>Math.max(0,Math.min(100,x)),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,p=a=>a[Math.floor(Math.random()*a.length)];function list(){M.forEach((m,i)=>{let b=document.createElement('button');b.className='member'+(i===0?' sel':'');b.innerHTML='<b>'+m[0]+'</b><div class="small">'+m[2]+'</div>';b.onclick=()=>{sel=i;document.querySelectorAll('.member').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('members').appendChild(b)})}function fresh(){let m=M[sel];s={m,week:1,st:[...m[3]],energy:100,staff:25,group:15,cond:'普通',speech:'今日も一歩ずつ、前へ進もう。',logs:[],live:{},bonds:20};save();show()}function save(){localStorage.setItem('hinata_v04',JSON.stringify(s))}function load(){let x=localStorage.getItem('hinata_v04');if(!x)return alert('保存データがありません');s=JSON.parse(x);show()}function cal(){let z=s.week-1,y=2016+Math.floor(z/48),q=z%48,mo=Math.floor(q/4)+1,w=q%4+1;return{y,mo,w}}function ov(){return Math.round(s.st.reduce((a,b)=>a+b,0)/6)}function show(){$('start').style.display='none';$('game').style.display='block';render()}function render(){let c=cal(),m=s.m;$('avatar').textContent=m[1];$('name').textContent=m[0];$('type').textContent=m[2];$('cond').textContent='調子：'+s.cond;$('speech').textContent=s.speech;$('date').textContent=c.y+'年'+c.mo+'月 第'+c.w+'週';$('notice').textContent=c.mo===8?'夏合宿ボーナス中':c.w===4?'今週終了後に月末ライブ':'';$('overall').textContent='総合 '+ov();$('energy').textContent=s.energy;$('staff').textContent=s.staff;$('group').textContent=s.group;$('energyBar').style.width=s.energy+'%';$('staffBar').style.width=s.staff+'%';$('groupBar').style.width=s.group+'%';$('stats').innerHTML=s.st.map((v,i)=>'<div class="stat"><span>'+K[i]+'</span><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><b>'+v+'</b></div>').join('');acts();$('log').innerHTML=s.logs.map(x=>'<div><span class="small">第'+x.w+'週</span><br>'+x.t+'</div>').join('')||'<div>物語が始まった。</div>';save()}function acts(){let A=[['ボイトレ',1,8],['ダンス',2,8],['トーク番組',3,9],['撮影',4,8],['一期生交流',5,7],['休養',-1,-24]];$('actions').innerHTML='';A.forEach(a=>{let b=document.createElement('button');b.className='action';let ch=a[1]<0?100:cl(82+(s.cond==='好調'?8:s.cond==='不調'?-12:0)-(s.energy<30?18:0));b.innerHTML='<b>'+a[0]+'</b><span class="chance">成功 '+ch+'%</span><div class="small">'+(a[1]<0?'体力回復・必ず成功':'能力を伸ばす')+'</div>';b.onclick=()=>go(a,ch);$('actions').appendChild(b)})}function go(a,ch){let c=cal();if(a[1]<0){s.energy=cl(s.energy+24);s.cond=p(['普通','普通','好調']);s.speech='しっかり休めた。次はいい動きができそう。';log('休養して体力を回復した。')}else{if(s.energy<8){s.energy=cl(s.energy-4);log('体力不足で成果を出せなかった。');return next()}s.energy-=a[2];let ok=r(1,100)<=ch,great=ok&&r(1,100)<=(c.mo===8?38:10),up=ok?(great?(c.mo===8?r(5,8):r(4,6)):(c.mo===8?r(3,5):r(2,4))):0;if(ok){s.st[a[1]]=cl(s.st[a[1]]+up);s.staff=cl(s.staff+1);s.group=cl(s.group+(a[1]===5?2:1));s.speech=great?'手応えあり！ この感覚を忘れないようにしよう。':'少しずつ成長できている気がする。';log((great?'大成功！ ':'')+a[0]+'で'+K[a[1]]+'+'+up)}else{s.st[5]=cl(s.st[5]-2);s.speech='今日はうまくいかなかった。でも次で取り返そう。';log(a[0]+'は失敗。')}}if(Math.random()<.16&&s.week>35){s.group=cl(s.group+4);s.staff=cl(s.staff+3);modal('友情発動','一期生の支え','前半で築いた絆が、後半の力になった。',[['一緒に乗り越える',()=>{log('友情効果でグループ人気+4、運営評価+3');close();next()}]]);return}next()}function next(){let c=cal();if(c.w===4&&!s.live[c.y+'-'+c.mo]){s.live[c.y+'-'+c.mo]=1;let sc=Math.round((s.st[1]+s.st[2]+s.st[4]+s.st[5])/4)+r(-8,8)+(c.mo===8?8:0);modal('MONTHLY LIVE',c.y+'年'+c.mo+'月 月末ライブ','ライブ評価：<b>'+(sc>=75?'大成功':sc>=60?'成功':'苦戦')+'</b><br>パフォーマンス値：'+sc,[['歌で勝負',()=>finish(1)],['ダンスで魅せる',()=>finish(2)],['一体感を優先',()=>finish(5)]]);return}s.week++;if(s.week>104)return end();if(Math.random()<.12)s.cond=p(['好調','普通','普通','不調']);render()}function finish(i){s.st[i]=cl(s.st[i]+2);s.group=cl(s.group+4);s.staff=cl(s.staff+2);s.speech='ライブを終えるたび、少しずつグループになっていく。';log('月末ライブ成功。グループ人気+4、'+K[i]+'+2');close();s.week++;render()}function end(){modal('ENDING','2年間の育成終了','総合評価 <b>'+ov()+'</b><br>運営評価 <b>'+s.staff+'</b><br>グループ人気 <b>'+s.group+'</b>',[['結果を見る',()=>{close();render()}]])}function log(t){s.logs.unshift({w:s.week,t});if(s.logs.length>80)s.logs.pop()}function modal(tag,t,b,cs){$('tag').textContent=tag;$('mt').textContent=t;$('mb').innerHTML=b;$('choices').innerHTML='';cs.forEach(c=>{let x=document.createElement('button');x.className='choice';x.textContent=c[0];x.onclick=c[1];$('choices').appendChild(x)});$('overlay').style.display='grid'}function close(){$('overlay').style.display='none'}$('startBtn').onclick=fresh;$('continueBtn').onclick=load;$('reset').onclick=()=>{if(confirm('最初からやり直しますか？')){localStorage.removeItem('hinata_v04');location.reload()}};list();</script></body></html>
