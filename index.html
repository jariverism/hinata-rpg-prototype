<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日向坂サクセス LOOP v1.7</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f5f1fb;color:#292333}.wrap{max-width:760px;margin:auto;padding:8px}.card{background:#fff;border:1px solid #e4dcf0;border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:0 8px 22px #3d2c6412}h1,h2,h3,p{margin-top:0}.small{font-size:12px;color:#777}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn,.member,.item,.act,.tab{display:block;text-decoration:none;color:inherit;border:1px solid #ddd4ed;background:#fff;border-radius:13px;padding:11px;font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:rgba(104,85,217,.2)}.btn{font-weight:800}.primary{background:#6855d9;color:#fff;border:0}.member{text-align:left}.member.on,.item.on{border:2px solid #6855d9;background:#f7f4ff}.item{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;text-align:left;margin-bottom:7px}.ico{width:38px;height:38px;border-radius:11px;background:#f0eafb;display:grid;place-items:center;font-size:20px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0ebfb;font-size:11px;margin:2px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;position:sticky;top:0;background:#f5f1fbe8;padding:6px 0;z-index:2}.tab{text-align:center;border:0;border-radius:10px;padding:10px;background:#eee8f7;font-weight:800}.tab.on{background:#6855d9;color:#fff}.stat{display:grid;grid-template-columns:65px 1fr 34px;gap:7px;align-items:center;margin:7px 0;font-size:13px}.bar{height:9px;background:#eee9f4;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6855d9,#ef7cb4)}.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.act{text-align:left;min-height:90px}.wide{grid-column:1/-1;text-align:center;background:#6855d9;color:#fff;border:0}.notice{background:#fff4ce;border:1px solid #efd885;border-radius:12px;padding:10px;margin-bottom:10px}.final{background:linear-gradient(135deg,#32245f,#6b54d9);color:#fff}.big{font-size:44px;font-weight:900}.row{display:flex;gap:8px;flex-wrap:wrap}.log{max-height:240px;overflow:auto}.log div{border-left:4px solid #6855d9;padding:7px;background:#faf8ff;border-radius:8px;margin-bottom:6px;font-size:12px}
</style></head><body><div id="app" class="wrap"></div>
<script>
(function(){
var MEM=[['井口眞緒','井','トーク型',[17,31,27,57,36,49],'ig'],['潮紗理菜','潮','安定型',[18,40,39,42,43,57],'ush'],['柿崎芽実','柿','表現型',[20,43,45,38,58,45],'mem'],['加藤史帆','加','万能型',[21,49,48,46,55,47],'kat'],['齊藤京子','齊','歌唱型',[23,64,37,44,52,53],'kyo'],['佐々木久美','久','統率型',[18,39,43,52,44,61],'kum'],['佐々木美玲','美','ライブ型',[20,54,53,46,49,57],'mir'],['高瀬愛奈','高','知性型',[16,40,39,44,42,56],'tak'],['高本彩花','彩','モデル型',[19,38,46,41,59,49],'aya'],['東村芽依','東','身体型',[18,37,61,31,51,52],'mei']];
var N=['人気','歌唱','ダンス','トーク','表現力','メンタル'];
var ITEMS={kat:{n:'負けず嫌いのノート',i:'📓'},kum:{n:'キャプテンのメモ帳',i:'🗒️'},kyo:{n:'歌姫のマイク',i:'🎤'},mir:{n:'太陽のペンライト',i:'☀️'},mei:{n:'俊足シューズ',i:'👟'},aya:{n:'ランウェイの鏡',i:'🪞'},ush:{n:'幸運のクローバー',i:'🍀'},tak:{n:'分析ノート',i:'📘'},ig:{n:'バラエティ笛',i:'📣'},mem:{n:'約束のリボン',i:'🎀'}};
var ACTS=[['ボイトレ',1],['ダンス',2],['バラエティ',3],['モデル撮影',4],['仲間と語る',5],['休養',-1]];
function read(k,f){try{var x=JSON.parse(localStorage.getItem(k));return x||f}catch(e){return f}}function save(k,x){localStorage.setItem(k,JSON.stringify(x))}function cl(n){return Math.max(0,Math.min(100,n))}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function href(a){return '?v=17&do='+a}
var raw=read('hinata_loop_meta',{}),meta={runs:Number(raw.runs)||0,owned:Array.isArray(raw.owned)?raw.owned.filter(function(x){return ITEMS[x]}):[],clears:raw.clears||{},centers:Number(raw.centers)||0,worlds:Array.isArray(raw.worlds)?raw.worlds:[],equipped:Array.isArray(raw.equipped)?raw.equipped.filter(function(x){return ITEMS[x]}).slice(0,2):[]};
var game=read('hinata_loop_run',null),sel=Number(localStorage.getItem('hinata_sel'))||3,screen=localStorage.getItem('hinata_screen')||'home',ending=read('hinata_ending',null);
if(game){game.week=Math.max(1,Number(game.week)||1);game.energy=Number(game.energy)||0;game.staff=Number(game.staff)||0;game.judges=Number(game.judges)||0;game.logs=Array.isArray(game.logs)?game.logs:[]}
function saveMeta(){save('hinata_loop_meta',meta)}function saveRun(){if(game)save('hinata_loop_run',game);else localStorage.removeItem('hinata_loop_run')}
function score(){return Math.round(game.st.reduce(function(a,b){return a+b},0)/6*.75+game.staff*.2+game.judges*3+(meta.equipped.indexOf('mem')>=0?15:0))}
function log(t){game.logs.unshift({w:game.week,t:t});if(game.logs.length>50)game.logs.pop()}
function finish(){if(!game)return;var sc=score(),rk=sc>=90?'S':sc>=78?'A':sc>=66?'B':sc>=54?'C':'D',title=rk==='S'?'デビュー曲センター':rk==='A'?'フロントメンバー':rk==='B'?'二列目選抜':rk==='C'?'三列目選抜':'選抜入りならず',id=game.m[6];if(meta.owned.indexOf(id)<0)meta.owned.push(id);meta.runs++;if(rk==='S')meta.centers++;meta.clears[id]=rk;saveMeta();ending={rk:rk,title:title,sc:sc,item:ITEMS[id].n,judges:game.judges};save('hinata_ending',ending);localStorage.removeItem('hinata_loop_run');screen='play';localStorage.setItem('hinata_screen',screen)}
function act(i){if(!game)return;var a=ACTS[i];if(a[1]<0){game.energy=cl(game.energy+30);log('休養して体力を回復')}else{game.energy=cl(game.energy-9);var ok=rnd(1,100)<=76;if(ok){var up=rnd(2,4);game.st[a[1]]=cl(game.st[a[1]]+up);game.staff=cl(game.staff+1);log(a[0]+'成功 '+N[a[1]]+'+'+up)}else{game.st[5]=cl(game.st[5]-3);log(a[0]+'失敗')}}if(game.week>=104){saveRun();finish()}else{game.week++;saveRun()}}
var q=new URLSearchParams(location.search),d=q.get('do');
if(d){if(d==='home'||d==='book'||d==='play'){if(d!=='play'||game){screen=d;localStorage.setItem('hinata_screen',screen)}}else if(d.indexOf('member-')===0){sel=Number(d.split('-')[1])||0;localStorage.setItem('hinata_sel',sel);screen='home'}else if(d.indexOf('equip-')===0){var id=d.slice(6),p=meta.equipped.indexOf(id);if(meta.owned.indexOf(id)>=0){if(p>=0)meta.equipped.splice(p,1);else{if(meta.equipped.length>=2)meta.equipped.shift();meta.equipped.push(id)}saveMeta()}}else if(d==='start'){var m=MEM[sel];game={m:m,week:1,st:m[3].slice(),energy:100,staff:18+(meta.equipped.indexOf('kum')>=0?10:0),judges:0,logs:[]};ending=null;localStorage.removeItem('hinata_ending');screen='play';localStorage.setItem('hinata_screen',screen);saveRun()}else if(d.indexOf('act-')===0){act(Number(d.split('-')[1]))}else if(d==='finish'){finish()}else if(d==='next'){ending=null;game=null;localStorage.removeItem('hinata_ending');saveRun();screen='home';localStorage.setItem('hinata_screen',screen)}history.replaceState(null,'',location.pathname+'?v=17')}
function nav(){return '<div class="tabs"><a class="tab '+(screen==='home'?'on':'')+'" href="'+href('home')+'">出発</a><a class="tab '+(screen==='book'?'on':'')+'" href="'+href('book')+'">遺物図鑑</a><a class="tab '+(screen==='play'?'on':'')+'" href="'+href('play')+'">育成</a></div>'}
function item(id){var o=ITEMS[id],on=meta.equipped.indexOf(id)>=0;return '<a class="item '+(on?'on':'')+'" href="'+href('equip-'+id)+'"><span class="ico">'+o.i+'</span><span><b>'+o.n+(on?'［装備中］':'')+'</b></span><span>'+(on?'解除':'装備')+'</span></a>'}
function home(){return '<div class="card"><div class="small">HINATA SUCCESS LOOP v1.7</div><h1>世界線を紡ぐ育成RPG</h1><span class="pill">周回 '+meta.runs+'</span><span class="pill">獲得遺物 '+meta.owned.length+'</span><span class="pill">センター '+meta.centers+'</span></div><div class="card"><h3>主人公</h3><div class="grid">'+MEM.map(function(m,i){return '<a class="member '+(i===sel?'on':'')+'" href="'+href('member-'+i)+'"><b>'+m[0]+'</b><div class="small">'+m[2]+'／最高 '+(meta.clears[m[6]]||'未完走')+'</div></a>'}).join('')+'</div></div><div class="card"><h3>装備中（'+meta.equipped.length+'/2）</h3>'+(meta.equipped.length?meta.equipped.map(item).join(''):'<div class="notice">装備なし</div>')+'<h3>所持遺物</h3>'+(meta.owned.length?meta.owned.map(item).join(''):'<p class="small">まだ遺物がない。</p>')+'<div class="row"><a class="btn primary" href="'+href('start')+'">この装備で育成開始</a>'+(game?'<a class="btn" href="'+href('play')+'">途中から</a>':'')+'</div></div>'}
function book(){return '<div class="card"><h2>遺物図鑑</h2>'+Object.keys(ITEMS).map(function(id){return meta.owned.indexOf(id)>=0?item(id):'<div class="item" style="opacity:.45"><span class="ico">？</span><span><b>未発見</b></span><span>---</span></div>'}).join('')+'</div>'}
function stats(){return game.st.map(function(v,i){return '<div class="stat"><span>'+N[i]+'</span><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><b>'+v+'</b></div>'}).join('')+'<div class="stat"><span>体力</span><div class="bar"><div class="fill" style="width:'+game.energy+'%"></div></div><b>'+game.energy+'</b></div><div class="stat"><span>運営</span><div class="bar"><div class="fill" style="width:'+game.staff+'%"></div></div><b>'+game.staff+'</b></div>'}
function finalView(){return '<div class="card final"><div class="small">WORLD LINE COMPLETE</div><div class="big">'+ending.rk+'</div><h1>'+ending.title+'</h1><p>最終評価 '+ending.sc+'／選抜審査突破 '+ending.judges+'/4</p></div><div class="card"><p>遺物「<b>'+ending.item+'</b>」を獲得した。</p><a class="btn primary" href="'+href('next')+'">次の世界線へ</a></div>'}
function play(){if(ending)return finalView();if(!game)return '<div class="card"><p>育成データがありません。</p></div>';var buttons=ACTS.map(function(a,i){return '<a class="act" href="'+href('act-'+i)+'"><b>'+a[0]+'</b><div class="small">'+(a[1]<0?'体力+30':'能力上昇・体力-9')+'</div></a>'}).join('');if(game.week>=104)buttons+='<a class="act wide" href="'+href('finish')+'"><b>この能力で最終センター発表へ</b></a>';return '<div class="card"><h2>'+game.m[0]+'　育成中</h2><div class="small">第'+game.week+'週／104週</div>'+(game.week>=104?'<div class="notice"><b>最終週</b><br>行動を1つ選ぶか、直接最終発表へ進める。</div>':'')+stats()+'<p><b>センター評価 '+score()+'</b></p></div><div class="card"><div class="acts">'+buttons+'</div></div><div class="card"><h3>活動記録</h3><div class="log">'+(game.logs.map(function(x){return '<div>第'+x.w+'週 '+x.t+'</div>'}).join('')||'<div>新しい世界線が始まった。</div>')+'</div></div>'}
document.getElementById('app').innerHTML=nav()+(screen==='home'?home():screen==='book'?book():play());
})();
</script></body></html>
