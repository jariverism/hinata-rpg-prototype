<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日向坂サクセス v0.5</title><style>:root{--m:#7157d9;--p:#ef75b3;--g:#18845d;--bg:#f6f2fc;--line:#e4dcf0}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:linear-gradient(145deg,#f4efff,#fff7fb);color:#282331}.wrap{max-width:760px;margin:auto;padding:8px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:0 8px 22px #49356b13}h1,h2,h3,p{margin-top:0}.small{font-size:12px;color:#777181}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.members,.actions,.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.member,.action,.choice,.btn{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;font:inherit}.member.sel{border:2px solid var(--m);background:#f8f5ff}.btn{font-weight:800}.primary{background:var(--m);color:#fff;border:0}.hero{display:flex;gap:12px;align-items:center}.avatar{width:86px;height:106px;border-radius:22px;background:linear-gradient(135deg,var(--m),var(--p));color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900}.speech{border:2px solid #e3d9f5;border-radius:16px;padding:12px;margin-top:11px;font-weight:700}.stat{display:grid;grid-template-columns:72px 1fr 34px;gap:7px;align-items:center;margin:7px 0;font-size:13px}.bar{height:9px;background:#eee9f4;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--m),var(--p))}.goal{background:linear-gradient(135deg,#30245d,#6c51d7);color:#fff}.goal .bar{background:#ffffff33}.goal .fill{background:linear-gradient(90deg,#ffd95e,#ff8fc5)}.rank{font-size:28px;font-weight:900}.date{font-size:20px;font-weight:900}.action{text-align:left;min-height:120px}.action b{display:block}.chance{font-size:11px;color:var(--g)}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#f0ebff;color:#5d48bd;font-size:11px;margin:2px}.log{display:grid;gap:6px;max-height:300px;overflow:auto}.log div{border-left:4px solid var(--m);background:#faf8ff;padding:8px;border-radius:9px;font-size:13px}.overlay{position:fixed;inset:0;background:#241b3899;display:none;place-items:center;padding:14px;z-index:20}.modal{background:#fff;border-radius:20px;padding:18px;max-width:540px;width:100%;max-height:90vh;overflow:auto}.choice{text-align:left}.choices{grid-template-columns:1fr}.result{padding:12px;border-radius:14px;background:#f7f3ff;margin:10px 0}@media(max-width:420px){.wrap{padding:6px}.card{padding:11px}.action{min-height:125px}.avatar{width:78px;height:98px}}</style></head><body><div id="start" class="wrap"><div class="card"><div class="small">SUCCESS MODE</div><h1>日向坂サクセス v0.5</h1><div class="card goal"><h2>ゴール：デビュー曲センター</h2><p>2年間で能力・人気・運営評価を伸ばし、4回の選抜審査を突破する。</p></div><h3>主人公を選択</h3><div id="members" class="members"></div><p><button id="startBtn" class="btn primary">育成開始</button> <button id="continueBtn" class="btn">続きから</button></p></div></div><div id="game" class="wrap" style="display:none"><div class="card"><div class="top"><div><div class="small">2016年 けやき坂創設編</div><h2>センターへの道</h2></div><button id="reset" class="btn">最初から</button></div></div><div class="card goal"><div class="top"><div><b>現在のセンター評価</b><div id="goalText" class="small" style="color:#eee"></div></div><div id="rank" class="rank"></div></div><div class="bar"><div id="centerBar" class="fill"></div></div><div id="nextExam" class="small" style="color:#eee;margin-top:7px"></div></div><div class="card"><div class="hero"><div id="avatar" class="avatar"></div><div><h2 id="name"></h2><div id="type" class="small"></div><div id="cond" class="small"></div><div id="skills"></div></div></div><div id="speech" class="speech"></div><div id="stats"></div><div class="stat"><span>体力</span><div class="bar"><div id="energyBar" class="fill"></div></div><b id="energy"></b></div><div class="stat"><span>運営評価</span><div class="bar"><div id="staffBar" class="fill"></div></div><b id="staff"></b></div><div class="stat"><span>絆</span><div class="bar"><div id="bondBar" class="fill"></div></div><b id="bond"></b></div></div><div class="card"><div class="top"><div><div id="date" class="date"></div><div id="notice" class="small"></div></div><b id="overall"></b></div><div id="actions" class="actions"></div></div><div class="card"><h3>活動記録</h3><div id="log" class="log"></div></div></div><div id="overlay" class="overlay"><div class="modal"><div id="tag" class="small"></div><h2 id="mt"></h2><div id="mb"></div><div id="choices" class="choices"></div></div></div><script>const M=[["井口眞緒","井","トーク型",[18,34,28,55,38,54]],["潮紗理菜","潮","安定型",[20,43,41,44,45,62]],["柿崎芽実","柿","表現型",[24,45,47,40,60,48]],["加藤史帆","加","万能型",[25,52,50,48,58,50]],["齊藤京子","齊","歌唱型",[28,68,40,47,55,57]],["佐々木久美","久","統率型",[21,42,46,55,47,65]],["佐々木美玲","美","ライブ型",[23,57,56,49,52,61]],["高瀬愛奈","高","知性型",[18,43,42,46,44,60]],["高本彩花","彩","モデル型",[22,40,48,43,61,52]],["東村芽依","東","身体能力型",[21,39,62,33,54,55]]],K=["人気","歌唱","ダンス","トーク","表現力","メンタル"],EX=[24,52,76,100];let sel=0,s=null;const $=x=>document.getElementById(x),cl=x=>Math.max(0,Math.min(100,x)),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,p=a=>a[Math.floor(Math.random()*a.length)];function list(){M.forEach((m,i)=>{let b=document.createElement('button');b.className='member'+(i?'':' sel');b.innerHTML='<b>'+m[0]+'</b><div class="small">'+m[2]+'</div>';b.onclick=()=>{sel=i;document.querySelectorAll('.member').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('members').appendChild(b)})}function fresh(){let m=M[sel];s={m,week:1,st:[...m[3]],energy:100,staff:25,bond:15,cond:'普通',speech:'センターを目指して、ここから始めよう。',logs:[],live:{},exam:0,skills:[],jobs:{tv:0,model:0,radio:0}};save();show()}function save(){localStorage.setItem('hinata_v05',JSON.stringify(s))}function load(){let x=localStorage.getItem('hinata_v05');if(!x)return alert('v0.5の保存データがありません');s=JSON.parse(x);show()}function cal(){let z=s.week-1,y=2016+Math.floor(z/48),q=z%48;return{y,mo:Math.floor(q/4)+1,w:q%4+1}}function ov(){return Math.round(s.st.reduce((a,b)=>a+b,0)/6)}function center(){return cl(Math.round(ov()*.45+s.staff*.25+s.st[0]*.2+s.bond*.1+s.exam*2))}function rank(){let x=center();return x>=90?'S':x>=80?'A':x>=68?'B':x>=55?'C':'D'}function show(){$('start').style.display='none';$('game').style.display='block';render()}function render(){let c=cal(),m=s.m,x=center();$('avatar').textContent=m[1];$('name').textContent=m[0];$('type').textContent=m[2];$('cond').textContent='調子：'+s.cond;$('speech').textContent=s.speech;$('date').textContent=c.y+'年'+c.mo+'月 第'+c.w+'週';$('notice').textContent=c.mo===8?'夏合宿：大成功率アップ':c.w===4?'今週終了後に月末ライブ':'';$('overall').textContent='総合 '+ov();$('rank').textContent=rank();$('centerBar').style.width=x+'%';$('goalText').textContent=x+' / 100';let ne=EX.find(w=>w>=s.week);$('nextExam').textContent=ne?'次の選抜審査まで '+(ne-s.week)+'週':'最終センター発表直前';$('energy').textContent=s.energy;$('staff').textContent=s.staff;$('bond').textContent=s.bond;$('energyBar').style.width=s.energy+'%';$('staffBar').style.width=s.staff+'%';$('bondBar').style.width=s.bond+'%';$('stats').innerHTML=s.st.map((v,i)=>'<div class="stat"><span>'+K[i]+'</span><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><b>'+v+'</b></div>').join('');$('skills').innerHTML=s.skills.map(x=>'<span class="badge">'+x+'</span>').join('');acts();$('log').innerHTML=s.logs.map(x=>'<div><span class="small">第'+x.w+'週</span><br>'+x.t+'</div>').join('')||'<div>オーディション合格。物語が始まった。</div>';save()}function acts(){let A=[['ボイトレ','train',1,8],['ダンス練習','train',2,8],['バラエティ出演','job',3,11],['モデル撮影','job',4,10],['ラジオ出演','job',0,9],['一期生交流','bond',5,7],['休養','rest',-1,-25]];$('actions').innerHTML='';A.forEach(a=>{let b=document.createElement('button');b.className='action';let ch=a[1]=='rest'?100:cl(84+(s.cond==='好調'?8:s.cond==='不調'?-12:0)-(s.energy<30?20:0));b.innerHTML='<b>'+a[0]+'</b><span class="chance">成功 '+ch+'%</span><div class="small">'+desc(a)+'</div>';b.onclick=()=>go(a,ch);$('actions').appendChild(b)})}function desc(a){if(a[1]=='rest')return'体力+25・必ず成功';if(a[1]=='job')return'能力・人気・運営評価';if(a[1]=='bond')return'絆を深め、後半支援';return K[a[2]]+'を大きく伸ばす'}function go(a,ch){let c=cal();if(a[1]=='rest'){s.energy=cl(s.energy+25);s.cond=p(['普通','普通','好調']);s.speech='休むことも、センターへの準備。';log('休養して体力を回復した。');return next()}if(s.energy<8){s.speech='無理をしすぎた。今日は動けない。';log('体力不足で成果を出せなかった。');return next()}s.energy=cl(s.energy-a[3]);let ok=r(1,100)<=ch,great=ok&&r(1,100)<=(c.mo===8?40:12),up=great?r(5,8):r(2,4);if(ok){s.st[a[2]]=cl(s.st[a[2]]+up);if(a[1]=='job'){s.st[0]=cl(s.st[0]+r(2,4));s.staff=cl(s.staff+2);let j=a[2]==3?'tv':a[2]==4?'model':'radio';s.jobs[j]++;if(s.jobs[j]==3)skill(j)}else if(a[1]=='bond'){s.bond=cl(s.bond+(great?8:5));s.staff=cl(s.staff+1)}else s.staff=cl(s.staff+1);s.speech=great?'大成功。この一歩がセンターにつながる。':'昨日の自分より、少し強くなれた。';log((great?'大成功！ ':'')+a[0]+'で'+K[a[2]]+'+'+up)}else{s.st[5]=cl(s.st[5]-2);s.speech='失敗しても、次の審査までは終われない。';log(a[0]+'は失敗。メンタル-2')}if(s.week>32&&s.bond>=45&&Math.random()<.14){s.energy=cl(s.energy+12);s.staff=cl(s.staff+4);s.speech='仲間が背中を押してくれた。';modal('友情発動','一期生の支え','前半で築いた絆が、本番前の力になった。<div class="result">体力+12・運営評価+4</div>',[['一緒に進む',()=>{log('友情効果が発動した。');close();next()}]]);return}next()}function skill(j){let n=j=='tv'?'リアクション王':j=='model'?'カメラ映え':'話し声の魅力';if(!s.skills.includes(n)){s.skills.push(n);s.staff=cl(s.staff+5);log('スキル「'+n+'」を獲得した。')}}function next(){let c=cal();if(EX.includes(s.week))return exam();if(c.w===4&&!s.live[c.y+'-'+c.mo])return live(c);s.week++;if(s.week>104)return ending();if(Math.random()<.12)s.cond=p(['好調','普通','普通','不調']);render()}function live(c){s.live[c.y+'-'+c.mo]=1;let sc=Math.round((s.st[1]+s.st[2]+s.st[4]+s.st[5])/4)+r(-8,8)+(c.mo===8?8:0);modal('MONTHLY LIVE',c.y+'年'+c.mo+'月 月末ライブ','ライブ評価：<b>'+(sc>=78?'大成功':sc>=62?'成功':'苦戦')+'</b><div class="result">パフォーマンス値 '+sc+'</div>',[['歌で勝負',()=>finishLive(1,sc)],['ダンスで魅せる',()=>finishLive(2,sc)],['一体感を優先',()=>finishLive(5,sc)]])}function finishLive(i,sc){s.st[i]=cl(s.st[i]+(sc>=78?4:2));s.st[0]=cl(s.st[0]+(sc>=78?4:2));s.staff=cl(s.staff+(sc>=78?3:1));s.bond=cl(s.bond+2);s.speech='ライブを終えるたび、センターが近づいてくる。';log('月末ライブ終了。'+K[i]+'と人気が上昇。');close();s.week++;render()}function exam(){let no=EX.indexOf(s.week)+1,need=[42,55,68,80][no-1],score=center()+r(-8,8),pass=score>=need;s.exam=no;s.speech=pass?'審査を突破した。次はもっと前へ。':'悔しい。でも評価を覆す時間はまだある。';modal('選抜審査 第'+no+'回',pass?'審査突破':'審査結果は苦戦','基準 '+need+'／今回 '+score+'<div class="result">'+(pass?'運営から次のステージを任された。運営評価+5':'序列は後退したが、育成は続行できる。メンタル-5')+'</div>',[['結果を受け止める',()=>{if(pass)s.staff=cl(s.staff+5);else s.st[5]=cl(s.st[5]-5);log('第'+no+'回選抜審査：'+(pass?'突破':'苦戦'));close();s.week++;render()}]])}function ending(){let x=center(),rr=rank(),title=rr=='S'?'デビュー曲センター':rr=='A'?'フロントメンバー':rr=='B'?'二列目メンバー':rr=='C'?'三列目メンバー':'選抜入りならず',msg=rr=='S'?'「デビュー曲のセンターは……'+s.m[0]+'！」':rr=='A'?'センターには届かなかった。しかし最前列でグループを支える。':rr=='B'?'次のシングルで前列を狙える位置をつかんだ。':rr=='C'?'舞台に立つ権利を守った。ここからが勝負だ。':'悔しさを胸に、もう一度オーディションへ向かう。';modal('FINAL RESULT',title,'<div class="result"><div class="rank">ランク '+rr+'</div>センター評価 '+x+'<br>総合 '+ov()+'／運営評価 '+s.staff+'／絆 '+s.bond+'</div><b>'+msg+'</b>',[['最初から再挑戦',()=>{localStorage.removeItem('hinata_v05');location.reload()}],['育成結果を残す',()=>close()]])}function log(t){s.logs.unshift({w:s.week,t});if(s.logs.length>90)s.logs.pop()}function modal(tag,t,b,cs){$('tag').textContent=tag;$('mt').textContent=t;$('mb').innerHTML=b;$('choices').innerHTML='';cs.forEach(c=>{let x=document.createElement('button');x.className='choice';x.textContent=c[0];x.onclick=c[1];$('choices').appendChild(x)});$('overlay').style.display='grid'}function close(){$('overlay').style.display='none'}$('startBtn').onclick=fresh;$('continueBtn').onclick=load;$('reset').onclick=()=>{if(confirm('最初からやり直しますか？')){localStorage.removeItem('hinata_v05');location.reload()}};list();</script></body></html>
