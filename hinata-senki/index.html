<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#172037" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>日向戦記 ―陽だまりの旗―</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>日向戦記 <small>―陽だまりの旗―</small></h1>
        <p id="chapterLabel">序章「目覚めた陽光」</p>
      </div>
      <button id="menuButton" class="icon-button" aria-label="メニュー">☰</button>
    </header>

    <section class="hud">
      <div><span>ターン</span><strong id="turnLabel">1</strong></div>
      <div><span>フェイズ</span><strong id="phaseLabel">自軍</strong></div>
      <div class="objective"><span>勝利条件</span><strong id="objectiveLabel">敵将撃破後、久美で城門を制圧</strong></div>
    </section>

    <main>
      <div id="mapViewport" class="map-viewport" aria-label="戦場マップ">
        <div id="map" class="map"></div>
      </div>

      <aside id="sidePanel" class="side-panel">
        <section id="unitCard" class="panel-card empty">
          <h2>ユニット情報</h2>
          <p>ユニットをタップしてください。</p>
        </section>

        <section class="panel-card controls">
          <div id="actionButtons" class="action-buttons"></div>
          <button id="dangerButton">敵危険範囲</button>
          <button id="endTurnButton" class="danger">ターン終了</button>
        </section>

        <section class="panel-card log-card">
          <h2>戦況</h2>
          <div id="battleLog" class="battle-log" aria-live="polite"></div>
        </section>
      </aside>
    </main>
  </div>

  <dialog id="modal">
    <div id="modalContent"></div>
    <form method="dialog"><button class="wide">閉じる</button></form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="./game.js"></script>
</body>
</html>
